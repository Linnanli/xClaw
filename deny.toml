[advisories]
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # Pre-existing advisories — tracked for upgrade in separate PRs
    # serde_yml unsound/unmaintained — direct dep, upgrade tracked separately
    "RUSTSEC-2025-0068",
    # tokio-tar PAX header parsing — sandbox containers only
    "RUSTSEC-2025-0111",
    # rustls-webpki CRL distributionPoint matching — 0.102.8 pinned by libsql transitive dep
    "RUSTSEC-2026-0049",
    # rustls-webpki URI name constraint bypass — 0.102.8 pinned by libsql transitive dep;
    # patched in >=0.103.12 but libsql 0.6.0 requires rustls 0.22 which pins 0.102.x
    "RUSTSEC-2026-0098",
    # rustls-webpki wildcard name constraint bypass — same 0.102.8 pin from libsql
    "RUSTSEC-2026-0099",
    # rand unsoundness with custom logger calling rand::rng() during reseed — we don't use this pattern;
    # revisit/remove by 2026-06-30, or when transitive deps (tower, nanoid, phf_generator) release rand ≥0.9.3 compat
    "RUSTSEC-2026-0097",

    # ─── xClaw-fork additions ─────────────────────────────────────────────
    # Wasmtime advisory cluster (transitive via WASM extension infra).
    # All come from the same wasmtime stack pinned by upstream ironclaw;
    # the channel/extension code paths are not active in xClaw fork (we
    # disabled telegram/heavy-integration/wasm-wit-compat jobs), so these
    # advisories do not affect the runtime hot path. Track separately for
    # eventual wasmtime bump.
    "RUSTSEC-2025-0046",  # wasmtime GHSA-fm79-3f68-h2fc
    "RUSTSEC-2025-0118",  # wasmtime GHSA-hc7m-r6v8-hg9q
    "RUSTSEC-2026-0020",
    "RUSTSEC-2026-0021",
    "RUSTSEC-2026-0067",
    "RUSTSEC-2026-0068",
    "RUSTSEC-2026-0085",
    "RUSTSEC-2026-0086",
    "RUSTSEC-2026-0087",
    "RUSTSEC-2026-0088",
    "RUSTSEC-2026-0089",
    "RUSTSEC-2026-0091",
    "RUSTSEC-2026-0092",
    "RUSTSEC-2026-0093",
    "RUSTSEC-2026-0094",
    "RUSTSEC-2026-0095",
    "RUSTSEC-2026-0096",
    "RUSTSEC-2026-0104",

    # rsa crate Marvin Attack timing sidechannel (RUSTSEC-2023-0071) — pulled
    # in by jsonwebtoken 10.x's `rust_crypto` backend. ironclaw_auth ONLY uses
    # HS256 with a shared secret (see crates/ironclaw_auth/src/jwt.rs); no RSA
    # code path is ever invoked. The vulnerability requires the attacker to
    # observe RSA decryption timing — irrelevant when no RSA primitive runs.
    # No safe upgrade is available upstream; remove this ignore once the rsa
    # crate ships a constant-time release. Tracked under #190.
    "RUSTSEC-2023-0071",

    # hickory-proto 0.25.2 — pulled in transitively by rama-dns 0.3.0-alpha.4,
    # which is verbatim-locked at `=0.3.0-alpha.4` per ADR-137 PR-N23 (see
    # crates/dasclaw_net_proxy/Cargo.toml). dasclaw_net_proxy uses rama-dns
    # only for upstream client-side name resolution: no DNSSEC features
    # (`dnssec-ring`/`dnssec-aws-lc-rs`) are enabled and no DNS server port
    # is exposed, so neither advisory is reachable from xClaw runtime.
    # Unblock when codex upstream bumps rama → hickory ≥ 0.26.1; tracked
    # under #357.
    "RUSTSEC-2026-0118",  # NSEC3 closest-encloser unbounded loop (DNSSEC validators only)
    "RUSTSEC-2026-0119",  # O(n²) name compression on encode (DNS server only)

    # rustls-pemfile 2.x is unmaintained as of 2025-10; upstream redirects
    # callers to the `PemObject` trait in `rustls-pki-types`. This crate is
    # pulled into the workspace transitively by bollard /
    # rustls-native-certs / hyper-rustls (libsql); reqwest 0.11 also pulls
    # the 1.x line. Issue #374 (PR landing this comment) migrated the only
    # **direct** consumer (`crates/dasclaw_cert_trust`) to
    # `rustls-pki-types::pem::PemObject`. The transitive paths can only be
    # cleared once bollard / libsql / reqwest upgrade upstream, so the
    # ignore stays until `cargo tree -i rustls-pemfile` is empty. There is
    # no security flaw, only a maintenance signal.
    "RUSTSEC-2025-0134",  # rustls-pemfile unmaintained (no CVE)
]

[licenses]
version = 2
allow = [
    "MIT",
    # MIT-0 (MIT No Attribution) is strictly more permissive than MIT —
    # required by `jsonschema` (used for workspace document schema validation).
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "MPL-2.0",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    # LGPL-2.0-or-later — vendored bubblewrap C sources statically linked
    # into `dasclaw_sandbox_linux` release binaries on Linux (ADR-144 OQ-C1c-7,
    # tracking issue #440). The C sources at
    # `crates/vendor/bubblewrap/` are NOT a Rust crate
    # and therefore are NOT visible to cargo-deny's license scanner (which
    # only walks the Cargo dependency graph). This entry is recorded
    # **declaratively** so that:
    #   1. Any future Rust crate accidentally pulling LGPL-2.0-or-later into
    #      the graph is fail-closed-allowed (rather than fail-open silently
    #      via `unused-allowed-license = "allow"`).
    #   2. Auditors reading deny.toml see the project's accepted license
    #      surface in one place, including statically-linked C components.
    # See top-level NOTICE §1 for upstream URL (containers/bubblewrap 0.11.0)
    # and the §6(a)/(b)/(c) compliance posture.
    "LGPL-2.0-or-later",
]
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
# xClaw fork: downgrade wildcards to "warn".
# Workspace binaries (admin-backend, desktop-client) and vendored
# sub-crates (ironclaw, ironclaw_safety) all carry license fields (needed
# for the cargo-deny licenses phase) which makes cargo-deny classify them
# as "public". When public, `allow-wildcard-paths = true` no longer applies
# because crates.io disallows path deps — but these crates are not
# published to crates.io (they are app binaries / vendored sub-crates
# inside a Tauri desktop app). The wildcard-paths come from intra-repo
# `path = "..."` deps which is the standard workspace pattern. Downgrade
# to "warn" so these path deps surface as warnings instead of failing CI.
wildcards = "warn"
# monty (Pydantic's embedded Python) is git-only (not on crates.io),
# so it inherently lacks a version constraint. Allow path-dep wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # Monty (Pydantic's embedded Python interpreter) — not yet on crates.io.
    # Pulls in ruff_* crates from astral-sh/ruff at a pinned revision.
    "https://github.com/pydantic/monty.git",
    "https://github.com/astral-sh/ruff.git",
]

