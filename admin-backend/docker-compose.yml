x-managed-policy-env: &managed_policy_env
  MANAGED_POLICY_SIGNING_KEY_B64: ${MANAGED_POLICY_SIGNING_KEY_B64:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}

services:
  postgres:
    image: postgres:15-alpine
    container_name: admin-backend-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ironclaw
      <<: *managed_policy_env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  skill-scanner:
    build:
      context: ./scanner
    container_name: admin-backend-skill-scanner
    ports:
      - "8000:8000"
    environment:
      <<: *managed_policy_env
      SKILL_SCANNER_LLM_API_KEY: ${SKILL_SCANNER_LLM_API_KEY:-}
      SKILL_SCANNER_LLM_MODEL: ${SKILL_SCANNER_LLM_MODEL:-claude-3-5-sonnet-20241022}
      SKILL_SCANNER_LLM_BASE_URL: ${SKILL_SCANNER_LLM_BASE_URL:-}
      SKILL_SCANNER_LLM_API_VERSION: ${SKILL_SCANNER_LLM_API_VERSION:-}
    volumes:
      - ./scanner/rules/signatures-append.yaml:/app/custom-rules/signatures/xclaw_custom.yaml:ro
      - ./scanner/rules/yara/skillhub_vetter.yara:/app/custom-rules/yara/xclaw_custom.yara:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
