services:
  postgres:
    image: postgres:15-alpine
    container_name: admin-backend-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ironclaw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  skill-scanner:
    build:
      context: ./scanner
    container_name: admin-backend-skill-scanner
    ports:
      - "8000:8000"
    volumes:
      - ./scanner/rules/signatures-append.yaml:/app/vetter-rules/signatures-append.yaml:ro
      - ./scanner/rules/yara/skillhub_vetter.yara:/usr/local/lib/python3.11/site-packages/skill_scanner/data/yara_rules/skillhub_vetter.yara:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
