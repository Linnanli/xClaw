[package]
name = "desktop-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"

[dependencies]
# Tauri framework
tauri = { version = "2.0", features = ["protocol-asset"] }
tauri-build = "2.0"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Cryptography
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
argon2 = "0.5"

# Database - libSQL for local encrypted storage
libsql = { version = "0.6", default-features = false, features = ["core", "replication"] }

# Additional dependencies
uuid = { version = "1", features = ["v4", "serde"] }
hex = "0.4"
toml = "0.8"
dirs = "6"
regex = "1"

# HTTP client for API calls
reqwest = { version = "0.11", features = ["json"] }

# URL encoding
urlencoding = "2"

# OS Keychain integration
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "4", features = ["rt-tokio-crypto-rust"] }
zbus = "4"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_Security_Credentials"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
proptest = "1"
# Main project for test helpers
ironclaw = { path = "..", features = ["libsql"] }

[build-dependencies]
tauri-build = "2.0"
