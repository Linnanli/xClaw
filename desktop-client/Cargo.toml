[package]
name = "desktop-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0 OR MIT"

[dependencies]
# Tauri framework
tauri = { version = "2.11", features = ["protocol-asset"] }
tauri-build = "2.0"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# Async traits
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Additional dependencies
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
regex = "1"
open = "5"

# Safety and DLP
ironclaw_safety = { path = "./ironclaw/crates/ironclaw_safety" }
dasclaw_sandbox = { path = "../crates/dasclaw_sandbox" }

# IronClaw embedded server (ADR-114 Ⅴ: package was renamed to `dasclaw`,
# alias the extern name back to `ironclaw` so all `use ironclaw::` imports
# in this crate keep resolving.)
ironclaw = { path = "./ironclaw", features = ["libsql"], package = "dasclaw" }

# HTTP client for API calls
reqwest = { version = "0.11", features = ["json", "stream"] }

# Configuration / env loading
dotenvy = "0.15"

# Date/time
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
ed25519-dalek = "2"

# Decimal (shared with ironclaw for LlmProvider::cost_per_token)
rust_decimal = "1"

# OS Keychain integration
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "4", features = ["rt-tokio-crypto-rust"] }
zbus = "4"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_Security_Credentials"] }

[dev-dependencies]
# Testing framework
wiremock = "0.6"
proptest = "1.0"
tokio-test = "0.4"
tempfile = "3"
mockito = "1.5"
serial_test = "3"
# Tauri test support
tauri = { version = "2.11", features = ["test"] }
# reqwest with blocking for tests
reqwest = { version = "0.11", features = ["json", "stream", "blocking"] }

[build-dependencies]
tauri-build = "2.0"

# Phase 2 Step I 之后 claw-code 是唯一 LLM 后端，这里的 feature passthrough
# 保留为 no-op default，避免下游 CI 脚本同步改 --features 参数。
[features]
default = ["claw-code-llm"]
claw-code-llm = ["ironclaw/claw-code-llm"]
