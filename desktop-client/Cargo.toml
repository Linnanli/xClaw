[package]
name = "desktop-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0 OR MIT"

[dependencies]
# Tauri framework
tauri = { version = "2.11", features = ["protocol-asset"] }
tauri-build = "2.0"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Debug-only WebDriver automation plugin (Choochmeque/tauri-plugin-webdriver).
# 安全门由两层有效机制保证，不依赖 cfg(debug_assertions) 选依赖（那在 target 表里无效）：
#   1) optional + `webdriver` feature：未开 feature 时根本不编译该依赖；
#   2) main.rs 仅在 cfg(all(debug_assertions, feature = "webdriver")) 下注册插件，
#      release 构建即便误开 feature 也不会暴露 :4445 自动化 HTTP 服务（JS eval 面）。
tauri-plugin-webdriver = { version = "0.2", optional = true }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# Async traits
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Additional dependencies
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
regex = "1"
open = "5"

# Safety and DLP
# `egress-gate` feature exposes the `IronclawEgressGate` adapter so this
# crate can plug `SafetyLayer` into the project-wide `EgressGate` trait
# (ADR-148 §6.4, closes issue #92 attachment DLP gate).
dasclaw_safety = { path = "../crates/dasclaw_safety", features = ["egress-gate"] }
dasclaw_sandbox = { path = "../crates/dasclaw_sandbox" }

# EgressGate trait (ADR-148) — single seam for data leaving the agent's
# trust boundary. Used to gate attachment extracted_text on both the
# LlmRequest and Persistence egress kinds.
dasclaw_core = { path = "../crates/dasclaw_core" }

# ADR-152 §3 F4.1 — `context` / `context_monitor` 已搬迁到 dasclaw_runtime / dasclaw_core，
# desktop-client 顶层 crate 直接引用 dasclaw_runtime::context::{JobContext, ContextManager}
# 与 dasclaw_runtime::JobState（state.rs / ipc/jobs.rs / ipc/extensions.rs / engine_startup_tests.rs）。
dasclaw_runtime = { path = "../crates/dasclaw_runtime" }

# IronClaw embedded server (ADR-114 Ⅴ: package was renamed to `dasclaw`,
# alias the extern name back to `ironclaw` so all `use ironclaw::` imports
# in this crate keep resolving.)
ironclaw = { path = "./ironclaw", features = ["libsql"], package = "dasclaw" }

# HTTP client for API calls
reqwest = { version = "0.11", features = ["json", "stream"] }

# Configuration / env loading
dotenvy = "0.15"

# Date/time
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
ed25519-dalek = "2"

# Decimal (shared with ironclaw for LlmProvider::cost_per_token)
rust_decimal = "1"

# OS Keychain integration
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "4", features = ["rt-tokio-crypto-rust"] }
zbus = "4"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_Security_Credentials"] }

[dev-dependencies]
# Testing framework
wiremock = "0.6"
proptest = "1.0"
tokio-test = "0.4"
tempfile = "3"
mockito = "1.5"
serial_test = "3"
# Tauri test support
tauri = { version = "2.11", features = ["test"] }
# reqwest with blocking for tests
reqwest = { version = "0.11", features = ["json", "stream", "blocking"] }

[build-dependencies]
tauri-build = "2.0"

# Phase 2 Step I 之后 claw-code 是唯一 LLM 后端，这里的 feature passthrough
# 保留为 no-op default，避免下游 CI 脚本同步改 --features 参数。
[features]
default = ["claw-code-llm"]
claw-code-llm = ["ironclaw/claw-code-llm"]
webdriver = ["dep:tauri-plugin-webdriver"]
