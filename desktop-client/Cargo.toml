[package]
name = "desktop-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"

[dependencies]
# Tauri framework
tauri = { version = "2.0", features = ["protocol-asset"] }
tauri-build = "2.0"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# Async traits
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Additional dependencies
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
regex = "1"

# Safety and DLP
ironclaw_safety = { path = "../ironclaw/crates/ironclaw_safety" }

# IronClaw embedded server
ironclaw = { path = "../ironclaw", features = ["libsql"] }

# HTTP client for API calls
reqwest = { version = "0.11", features = ["json", "stream"] }

# Configuration / env loading
dotenvy = "0.15"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Decimal (shared with ironclaw for LlmProvider::cost_per_token)
rust_decimal = "1"

# OS Keychain integration
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "4", features = ["rt-tokio-crypto-rust"] }
zbus = "4"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_Security_Credentials"] }

[dev-dependencies]
# Testing framework
wiremock = "0.6"
proptest = "1.0"
tokio-test = "0.4"
tempfile = "3"
mockito = "1.5"
serial_test = "3"
# Tauri test support
tauri = { version = "2.0", features = ["test"] }
# reqwest with blocking for tests
reqwest = { version = "0.11", features = ["json", "stream", "blocking"] }

[build-dependencies]
tauri-build = "2.0"
