<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IronClaw Desktop</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@17.0.2/lib/marked.umd.min.js"></script>
</head>
<body>
  <!-- Auth Screen -->
  <div id="auth-screen">
    <div class="auth-card-login">
      <div class="auth-brand">
        <h1>IronClaw</h1>
        <p class="auth-tagline">Secure AI Assistant</p>
      </div>
      <div class="auth-form">
        <label for="master-password">Master Password</label>
        <input type="password" id="master-password" placeholder="Enter your master password" autofocus>
        <button onclick="authenticateDesktop()">Unlock</button>
      </div>
      <div id="auth-error"></div>
      <p class="auth-hint">Enter your master password to unlock the application.</p>
    </div>
  </div>

  <!-- Main App (hidden until authenticated) -->
  <div id="app" style="display: none;">
    <!-- Tab Bar -->
    <div class="tab-bar">
      <button class="active" data-tab="chat">Chat</button>
      <button data-tab="memory">Memory</button>
      <button data-tab="jobs">Jobs</button>
      <button data-tab="routines">Routines</button>
      <button data-tab="extensions">Extensions</button>
      <button data-tab="skills">Skills</button>
      <button data-tab="plugins">Plugins</button>
      <div class="spacer"></div>
      <button class="status-logs-btn" data-tab="logs" title="Logs">Logs</button>
      <div class="status" id="gateway-status-trigger">
        <div class="dot" id="sse-dot"></div>
        <span id="sse-status">Connected</span>
        <span id="offline-indicator" class="offline-indicator" style="display: none;">Offline</span>
      </div>
    </div>

    <!-- Chat Tab -->
    <div class="tab-panel active" id="tab-chat">
      <div class="thread-sidebar" id="thread-sidebar">
        <div class="thread-sidebar-header">
          <button class="thread-new-btn" onclick="createNewThread()" title="New thread">+</button>
          <div class="spacer"></div>
          <button class="thread-toggle-btn" id="thread-toggle-btn" onclick="toggleThreadSidebar()">&laquo;</button>
        </div>
        <div class="assistant-item" id="assistant-thread" onclick="switchToAssistant()">
          <span class="assistant-label">Assistant</span>
          <span class="assistant-meta" id="assistant-meta"></span>
        </div>
        <div class="threads-section-header">
          <span>Conversations</span>
        </div>
        <div class="thread-list" id="thread-list"></div>
      </div>
      <div class="chat-container">
        <div class="chat-messages" id="chat-messages"></div>
        <div id="slash-autocomplete" class="slash-autocomplete" style="display:none"></div>
        <div class="chat-input">
          <div id="image-preview-strip" class="image-preview-strip"></div>
          <textarea id="chat-input" placeholder="Message or / for commands..." rows="1"></textarea>
          <input type="file" id="image-file-input" accept="image/*" multiple style="display:none">
          <button id="attach-btn" class="attach-btn" title="Attach images">📎</button>
          <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
      </div>
    </div>

    <!-- Approval Modal -->
    <div id="approval-modal" class="approval-modal" style="display: none;">
      <div class="approval-modal-overlay" onclick="closeApprovalModal()"></div>
      <div class="approval-modal-content">
        <div class="approval-modal-header">
          <h2>Sensitive Operation Approval</h2>
          <button class="approval-modal-close" onclick="closeApprovalModal()">×</button>
        </div>
        <div class="approval-modal-body">
          <div id="approval-details"></div>
        </div>
        <div class="approval-modal-footer">
          <button class="approval-modal-btn deny" onclick="denyApproval()">Deny</button>
          <button class="approval-modal-btn approve" onclick="approveApproval()">Approve</button>
        </div>
      </div>
    </div>

    <!-- CoT Display Modal -->
    <div id="cot-modal" class="cot-modal" style="display: none;">
      <div class="cot-modal-overlay" onclick="closeCoTModal()"></div>
      <div class="cot-modal-content">
        <div class="cot-modal-header">
          <h2>Thinking Process</h2>
          <button class="cot-modal-close" onclick="closeCoTModal()">×</button>
        </div>
        <div class="cot-modal-body">
          <div id="cot-content"></div>
        </div>
      </div>
    </div>

    <!-- Plugins Tab -->
    <div class="tab-panel" id="tab-plugins">
      <div class="plugins-container">
        <div class="plugins-header">
          <h2>Plugin Management</h2>
          <div class="plugins-controls">
            <input type="text" id="plugin-search" placeholder="Search plugins..." class="plugin-search">
            <button onclick="refreshPlugins()" class="plugin-refresh-btn">Refresh</button>
          </div>
        </div>
        
        <div class="plugins-tabs">
          <button class="plugin-tab-btn active" onclick="switchPluginTab('installed')">Installed</button>
          <button class="plugin-tab-btn" onclick="switchPluginTab('available')">Available</button>
          <button class="plugin-tab-btn" onclick="switchPluginTab('updates')">Updates</button>
        </div>

        <!-- Installed Plugins -->
        <div id="installed-plugins-panel" class="plugin-panel active">
          <div id="installed-plugins-list" class="plugins-list"></div>
        </div>

        <!-- Available Plugins -->
        <div id="available-plugins-panel" class="plugin-panel">
          <div id="available-plugins-list" class="plugins-list"></div>
        </div>

        <!-- Plugin Updates -->
        <div id="updates-plugins-panel" class="plugin-panel">
          <div id="updates-plugins-list" class="plugins-list"></div>
        </div>
      </div>
    </div>

    <!-- Plugin Details Modal -->
    <div id="plugin-modal" class="plugin-modal" style="display: none;">
      <div class="plugin-modal-overlay" onclick="closePluginModal()"></div>
      <div class="plugin-modal-content">
        <div class="plugin-modal-header">
          <h2 id="plugin-modal-title"></h2>
          <button class="plugin-modal-close" onclick="closePluginModal()">×</button>
        </div>
        <div class="plugin-modal-body">
          <div id="plugin-modal-details"></div>
        </div>
        <div class="plugin-modal-footer">
          <button id="plugin-action-btn" class="plugin-action-btn" onclick="performPluginAction()"></button>
          <button class="plugin-cancel-btn" onclick="closePluginModal()">Close</button>
        </div>
      </div>
    </div>

    <!-- Extensions Tab -->
    <div class="tab-panel" id="tab-extensions">
      <div class="extensions-container">
        <div class="extensions-header">
          <h2>Extensions Management</h2>
          <div class="extensions-controls">
            <input type="text" id="extension-search" placeholder="Search extensions..." class="extension-search">
            <button onclick="refreshExtensions()" class="extension-refresh-btn">Refresh</button>
          </div>
        </div>
        
        <div class="extensions-tabs">
          <button class="extension-tab-btn active" onclick="switchExtensionTab('installed')">Installed</button>
          <button class="extension-tab-btn" onclick="switchExtensionTab('available')">Available</button>
        </div>

        <!-- Installed Extensions -->
        <div id="installed-extensions-panel" class="extension-panel active">
          <div id="installed-extensions-list" class="extensions-list"></div>
        </div>

        <!-- Available Extensions -->
        <div id="available-extensions-panel" class="extension-panel">
          <div id="available-extensions-list" class="extensions-list"></div>
        </div>
      </div>
    </div>

    <!-- Routines Tab -->
    <div class="tab-panel" id="tab-routines">
      <div class="routines-container">
        <div class="routines-header">
          <h2>Routines Management</h2>
          <button onclick="showCreateRoutineModal()" class="routine-create-btn">+ New Routine</button>
        </div>
        
        <div class="routines-list" id="routines-list"></div>
      </div>
    </div>

    <!-- Create Routine Modal -->
    <div id="routine-modal" class="routine-modal" style="display: none;">
      <div class="routine-modal-overlay" onclick="closeRoutineModal()"></div>
      <div class="routine-modal-content">
        <div class="routine-modal-header">
          <h2>Create Routine</h2>
          <button class="routine-modal-close" onclick="closeRoutineModal()">×</button>
        </div>
        <div class="routine-modal-body">
          <div class="form-group">
            <label for="routine-name">Name</label>
            <input type="text" id="routine-name" placeholder="Routine name">
          </div>
          <div class="form-group">
            <label for="routine-description">Description</label>
            <textarea id="routine-description" placeholder="Routine description"></textarea>
          </div>
          <div class="form-group">
            <label for="routine-trigger">Trigger Type</label>
            <select id="routine-trigger">
              <option value="manual">Manual</option>
              <option value="time">Time-based (Cron)</option>
              <option value="event">Event-based</option>
            </select>
          </div>
          <div class="form-group" id="trigger-value-group" style="display: none;">
            <label for="routine-trigger-value">Trigger Value</label>
            <input type="text" id="routine-trigger-value" placeholder="e.g., 0 9 * * * for 9 AM daily">
          </div>
        </div>
        <div class="routine-modal-footer">
          <button class="routine-modal-btn cancel" onclick="closeRoutineModal()">Cancel</button>
          <button class="routine-modal-btn create" onclick="createNewRoutine()">Create</button>
        </div>
      </div>
    </div>

    <!-- Watermark -->
    <div id="watermark" class="watermark"></div>
  </div>

  <div id="toasts"></div>
  <script src="/app-desktop.js"></script>
</body>
</html>
