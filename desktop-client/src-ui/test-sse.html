<!DOCTYPE html>
<html>
<head>
    <title>SSE Connection Test</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #00ff00;
        }
        .log {
            margin: 5px 0;
            padding: 5px;
            background: #2a2a2a;
            border-left: 3px solid #00ff00;
        }
        .error {
            border-left-color: #ff0000;
            color: #ff0000;
        }
        .success {
            border-left-color: #00ff00;
        }
        .info {
            border-left-color: #0088ff;
            color: #0088ff;
        }
    </style>
</head>
<body>
    <h1>SSE Connection Test</h1>
    <div id="logs"></div>

    <script>
        const logsDiv = document.getElementById('logs');
        
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logsDiv.appendChild(div);
            console.log(message);
        }

        const token = '59c7c863fa5bd3eeffc94533cd70a3393251c3ada49a226146a5a61ba62d6743';
        const url = `http://localhost:3000/api/chat/events?token=${encodeURIComponent(token)}`;
        
        log(`Connecting to: ${url}`, 'info');
        
        const eventSource = new EventSource(url);
        
        eventSource.onopen = () => {
            log('✅ SSE connection opened', 'success');
        };
        
        eventSource.onmessage = (event) => {
            log(`📨 Message received: ${event.data.substring(0, 100)}`, 'success');
            try {
                const data = JSON.parse(event.data);
                log(`   Parsed: ${JSON.stringify(data, null, 2)}`, 'info');
            } catch (e) {
                log(`   Failed to parse: ${e.message}`, 'error');
            }
        };
        
        eventSource.onerror = (error) => {
            log(`❌ SSE error: ${JSON.stringify(error)}`, 'error');
            log(`   ReadyState: ${eventSource.readyState}`, 'error');
            if (eventSource.readyState === EventSource.CLOSED) {
                log('   Connection closed', 'error');
            } else if (eventSource.readyState === EventSource.CONNECTING) {
                log('   Reconnecting...', 'info');
            }
        };
        
        // 测试发送消息
        setTimeout(() => {
            log('📤 Sending test message...', 'info');
            fetch('http://localhost:3000/api/chat/send', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`,
                },
                body: JSON.stringify({
                    content: 'Hello from SSE test',
                    thread_id: 'test-thread',
                }),
            })
            .then(response => response.json())
            .then(data => {
                log(`✅ Message sent: ${JSON.stringify(data)}`, 'success');
            })
            .catch(error => {
                log(`❌ Failed to send message: ${error.message}`, 'error');
            });
        }, 2000);
    </script>
</body>
</html>
