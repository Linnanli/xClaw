[package]
name = "dasclaw"
version = "0.24.0"
edition = "2024"
rust-version = "1.92"
description = "Secure personal AI assistant that protects your data and expands its capabilities on the fly"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/nearai/ironclaw"
repository = "https://github.com/nearai/ironclaw"
# ADR-114 Ⅴ — invoke the canonical `dasclaw` binary by default. The legacy
# `ironclaw` binary is kept as a deprecation shim that prints a warning and
# then runs the same code path; see `[[bin]]` blocks below and the argv[0]
# branch at the top of `fn main()` in `src/main.rs`.
default-run = "dasclaw"

[package.metadata.wix]
upgrade-guid = "D0156E61-BA37-451E-8AB9-1A2ECCCFA48F"
path-guid = "F90B6EA6-87F7-499B-BB19-CF55DE1EB339"
license = false
eula = false

# ADR-114 Ⅴ — keep the Rust library crate name as `ironclaw` so every
# `use ironclaw::...` import inside the workspace (including the 200+ test
# files in this crate plus all downstream consumers in `desktop-client/`)
# continues to resolve without source changes. Only the *package* name and
# the *binary* name move to `dasclaw`; symbol-level references stay put.
[lib]
name = "ironclaw"
path = "src/lib.rs"

# ADR-114 Ⅴ — canonical entry point.
[[bin]]
name = "dasclaw"
path = "src/main.rs"

# ADR-114 Ⅴ — legacy entry point retained for one release cycle as a
# compatibility alias. The same `src/main.rs` is compiled twice; the
# binary detects argv[0] == "ironclaw" and emits a single deprecation
# warning to stderr before delegating to the normal startup flow.
[[bin]]
name = "ironclaw"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
eventsource-stream = "0.2"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls-native-roots", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database - PostgreSQL (default, feature-gated)
deadpool-postgres = { version = "0.14", optional = true }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"], optional = true }
postgres-types = { version = "0.2", features = ["with-serde_json-1"], optional = true }
refinery = { version = "0.8", features = ["tokio-postgres"], optional = true }
tokio-postgres-rustls = { version = "0.13", optional = true }
rustls = { version = "0.23", optional = true, default-features = false }
rustls-native-certs = { version = "0.8", optional = true }
webpki-roots = { version = "0.26", optional = true }

# Database - libSQL/Turso (optional embedded database)
libsql = { version = "0.6", optional = true, default-features = false, features = ["core", "replication", "remote", "tls"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration
dotenvy = "0.15"
toml = "0.8"

# Core types
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
rust_decimal = { version = "1", features = ["serde", "serde-with-str", "maths"] }
rust_decimal_macros = "1"
lsp-types = "0.97"

# Async traits
async-trait = "0.1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Terminal
crossterm = "0.29"
rustyline = { version = "17", features = ["custom-bindings", "derive", "with-file-history"] }
termimad = "0.34"

# Channel integrations
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "set-header", "catch-panic"] }

# Cron scheduling for routines
cron = "0.13"

# Shared types
ironclaw_common = { path = "crates/ironclaw_common", version = "0.1.0" }

# Agent runtime domain model (Phase 3 Step D-0: messages moved from llm/provider.rs)
dasclaw_core = { path = "../../crates/dasclaw_core", version = "0.1.0" }

# W3.1a: OS-level sandbox executor (replaces Docker sandbox path)
dasclaw_exec = { path = "../../crates/dasclaw_exec", version = "0.1.0" }
dasclaw_sandbox = { path = "../../crates/dasclaw_sandbox", version = "0.0.0-w1" }
# #324 sub-task 1 — pre-main hardening (disable core dumps / ptrace / dangerous
# env vars). Wired via `#[ctor::ctor] fn pre_main()` at the top of main.rs.
# Pattern matches codex `responses-api-proxy/src/main.rs:4-7`.
dasclaw_process_hardening = { path = "../../crates/dasclaw_process_hardening" }
ctor = "0.2"
# W3.2b: audited HTTP egress proxy (allowlist + credential injection)
dasclaw_net_proxy = { path = "../../crates/dasclaw_net_proxy", version = "=0.0.0-w7" }
# ADR-139 §4.5 PR1: MITM CA trust-chain manager (per-user keychain + env-var fallback)
dasclaw_cert_trust = { path = "../../crates/dasclaw_cert_trust", version = "=0.0.0-w8" }
# P0-3 (ADR-113): unified hook engine — single front-door for event hooks + trait seams
dasclaw_hooks = { path = "../../crates/dasclaw_hooks", version = "0.1.0" }
# ADR-152 §3 F2.1 — verbatim port: replaces 845-line local bash_validator
dasclaw_bash_validation = { path = "../../crates/dasclaw_bash_validation", version = "=0.0.0-w1" }
# W3 #53: codex-protocol apply_patch parser + minimal apply layer
dasclaw_apply_patch = { path = "../../crates/dasclaw_apply_patch", version = "0.0.0-w1" }
dasclaw_workspace_cap = { path = "../../crates/dasclaw_workspace_cap", version = "0.1.0" }
# ADR-152 §3 F4.2.0 — `routine` 类型 + `RoutineError` verbatim 搬迁
dasclaw_routines = { path = "../../crates/dasclaw_routines", version = "0.0.0-w1" }
# ADR-152 §3 F4.5 (first slice) — channel core trait + manager + relay extracted
dasclaw_channels = { path = "../../crates/dasclaw_channels", version = "0.0.0-w1" }
# ADR-149 / issue #485 — Tool Visibility Triple Gate (`ToolVisibilityPolicy`
# trait + closed-enum decisions). Default-OFF in the crate, host opts in.
dasclaw_governance = { path = "../../crates/dasclaw_governance", version = "0.0.0-w1", features = ["tool_visibility"] }

# Safety/sanitization
dasclaw_safety = { path = "../../crates/dasclaw_safety", version = "0.2.0", features = ["egress-gate"] }
regex = "1"
aho-corasick = "1"

# YAML parsing for SKILL.md frontmatter
serde_yml = "0.0.12"

# Filesystem paths
dirs = "6"
fs4 = "0.6"
globset = "0.4"

# Semantic versioning
semver = "1"

# Secrecy for sensitive values
secrecy = { version = "0.10", features = ["serde"] }

# URL parsing and encoding
url = "2"
urlencoding = "2"

# Open URLs in browser
open = "5"

# Vector embeddings for semantic search
# The postgres feature provides ToSql/FromSql for postgres-types (shared by tokio-postgres)
pgvector = { version = "0.4", features = ["postgres"], optional = true }

# WASM sandbox for untrusted tool execution
wasmtime = { version = "28", features = ["component-model"] }
wasmtime-wasi = "28"  # WASI support for component model
wasmparser = "0.220"  # WASM binary parsing for validation

# Cryptography for secrets management
aes-gcm = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
blake3 = "1"
rand = "0.8"
subtle = "2"  # Constant-time comparisons for token validation

# Multi-provider LLM support (主仓自实现 client，W6-C PR-A.4 起替代 claw-code-api path-dep；
# claw-code 子仓自此只读保留，详见 ADR-118)
dasclaw_llm_provider = { path = "../../crates/dasclaw_llm_provider" }

# MCP wire types + typed server-name allowlist (F3.2 phase 1; ADR-152 §3).
dasclaw_mcp = { path = "../../crates/dasclaw_mcp" }

# LSP client / registry / protocol / server-config core (F3.3; ADR-152 §3, #629).
dasclaw_lsp = { path = "../../crates/dasclaw_lsp" }

# Observability traits + Noop/Log/Multi observers + PromptCacheMonitor (F3.5; ADR-152 §3, #631).
dasclaw_observability = { path = "../../crates/dasclaw_observability" }

# Tool implementation-layer error type (F3.2 phase 2 PR 1; ADR-152 §3, #641).
dasclaw_tool = { path = "../../crates/dasclaw_tool" }

# Application-layer error type + future shared runtime context
# (F3.2 phase 2 PR 2; ADR-152 §3, #641).
dasclaw_runtime = { path = "../../crates/dasclaw_runtime" }

# WASM sandbox primitives (allowlist / capabilities / credential injector /
# host / limits / storage / error). Extracted from desktop tools/wasm/ under
# ADR-152 F4.5.3.
dasclaw_wasm_tools = { path = "../../crates/dasclaw_wasm_tools" }

# F4.6.1 — misc builtin tools (echo/time/json/plan_mode/restart/session_fork)
# extracted from desktop tools/builtin/ per ADR-156 §6.3.
dasclaw_misc_tools = { path = "../../crates/dasclaw_misc_tools" }

# F4.6.2 — vision/image LLM tools (image_analyze/image_edit/image_generate)
# extracted from desktop tools/builtin/ per ADR-156 §6.3.
dasclaw_image_tools = { path = "../../crates/dasclaw_image_tools" }

# F4.6.8 (phase 1, web_fetch) — network/web LLM tools per ADR-156 §6.3.
dasclaw_net_tools = { path = "../../crates/dasclaw_net_tools" }

# F4.6.6-a — fs leaf utilities (path_utils + file_guard) per ADR-156 §6.3.
dasclaw_fs_tools = { path = "../../crates/dasclaw_fs_tools" }

# F4.6.5 — git builtin tools (status/diff/log/branch/commit/push/stale) extracted
# from desktop tools/builtin/git/ per ADR-156 §6.3.
dasclaw_git_tools = { path = "../../crates/dasclaw_git_tools" }

# F4.6.4 — sub_agent builtin tool (SubAgentTool / SubAgentRole)
# extracted from desktop tools/builtin/ per ADR-156 §6.3.
dasclaw_sub_agent_tools = { path = "../../crates/dasclaw_sub_agent_tools" }

# F4.6.7 Phase 1 — shell-tool sandbox-independent helpers (risk classification,
# injection detection, env scrubbing list, output truncation) extracted from
# desktop tools/builtin/shell.rs per ADR-156 §6.3.
dasclaw_shell_tools = { path = "../../crates/dasclaw_shell_tools" }

# AWS Bedrock (native Converse API, opt-in via --features bedrock)
aws-config = { version = "1", features = ["behavior-version-latest"], optional = true }
aws-sdk-bedrockruntime = { version = "1", optional = true }
aws-smithy-types = { version = "1", optional = true }

# Docker sandbox
bollard = "0.18"

# Archive extraction for WASM extension bundles
flate2 = "1"
tar = "0.4"

# Document text extraction
pdf-extract = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }

# HTTP proxy for sandboxed network access
hyper = { version = "1.5", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "tokio", "http1", "http2"] }
http-body-util = "0.1"
bytes = "1"
base64 = "0.22.1"
jsonwebtoken = "9"
mime_guess = "2.0.5"
clap_complete = "4.5.0"
lru = "0.16.3"

# HTML to Markdown conversion (feature gated) — moved into dasclaw_net_tools
# in F4.6.8 phase 2. Desktop feature forwards via `html-to-markdown` below.
ed25519-dalek = { version = "2.2.0", features = ["std"] }
hex = "0.4.3"

# OpenClaw import (feature gated)
json5 = { version = "0.4", optional = true }

# Test support (feature gated)
tempfile = { version = "3", optional = true }

# macOS keychain
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

# PTY allocation for Claude CLI stdout buffering fix (Unix only)
[target.'cfg(unix)'.dependencies]
pty-process = { version = "0.5", features = ["async"] }

# Linux secret-service (GNOME Keyring, KWallet)
[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "4", features = ["rt-tokio-crypto-rust"] }
zbus = "4"

# Windows Credential Manager (master-key storage; data sealed by DPAPI per-user)
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
] }

[dev-dependencies]
# ADR-114 Ⅴ — the package is now `dasclaw` but every `use ironclaw::` in
# this crate's tests resolves through the extern-name `ironclaw`, which is
# achieved by aliasing the dev-dep entry: extern name `ironclaw` → package
# `dasclaw`.
ironclaw = { path = ".", features = ["test-support"], package = "dasclaw" }
tokio-test = "0.4"
tracing-test = "0.2"
tempfile = "3"
# Snapshot tests. Version is centrally pinned via the root
# `[workspace.dependencies]` table (issues #898 / #899); the workspace
# entry also enables the `json` feature, which is inert for tests that
# only use `assert_snapshot!`.
insta = { workspace = true }
criterion = "0.5"

[[bench]]
name = "safety_check"
harness = false

[[bench]]
name = "safety_pipeline"
harness = false

[features]
default = ["postgres", "libsql", "html-to-markdown"]
test-support = ["dep:tempfile"]
# 历史遗留：Phase 2 Step I 之前用来切换 rig-core / claw-code-api 两套 LLM
# 后端，W6-C PR-A.4 之后 dasclaw_llm_provider 是唯一路径，feature 名保留为空
# no-op，避免下游（如 desktop-client）触发构建失败。下一次 minor 版本可同步
# 删除该 feature 与 desktop-client/Cargo.toml 中的 passthrough。
claw-code-llm = []
postgres = [
    "dep:deadpool-postgres",
    "dep:tokio-postgres",
    "dep:tokio-postgres-rustls",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:webpki-roots",
    "dep:postgres-types",
    "dep:refinery",
    "dep:pgvector",
    "rust_decimal/db-tokio-postgres",
    # F3.2 phase 2 PR 4c (#641): the Postgres secrets store moved into
    # dasclaw_runtime. Forward our feature flag so its optional deps and
    # the `PostgresSecretsStore` re-export are pulled in alongside ours.
    "dasclaw_runtime/postgres",
    # ADR-152 §3 F3.4 slice 5 (#674): repository moved to dasclaw_workspace_cap.
    # Forward our feature flag so the optional postgres deps are pulled in
    # and the `repository` module + `Repository` re-export become available.
    "dasclaw_workspace_cap/postgres",
    # ADR-152 F4.5.3: forward postgres feature to the new wasm-tools crate so
    # the `PostgresWasmToolStore` re-export resolves.
    "dasclaw_wasm_tools/postgres",
]
libsql = ["dep:libsql", "dasclaw_runtime/libsql", "dasclaw_wasm_tools/libsql"]
# Opt-in feature for especially heavy integration-test targets that run in a
# dedicated CI job instead of the default Rust test matrix.
integration = []
html-to-markdown = ["dasclaw_net_tools/html-to-markdown"]
bedrock = ["dep:aws-config", "dep:aws-sdk-bedrockruntime", "dep:aws-smithy-types"]
import = ["dep:json5", "libsql"]

[[test]]
name = "e2e_thread_scheduling"
required-features = ["libsql", "integration"]

[[test]]
name = "html_to_markdown"
required-features = ["html-to-markdown"]
