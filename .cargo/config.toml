# 加速开发编译
#
# 1) sccache：编译产物缓存。已通过 brew/cargo 安装到 /usr/local/bin/sccache 或 ~/.cargo/bin/sccache。
#    若本机未装可执行 `cargo install sccache` 或 `brew install sccache`。
#    通过 [build].rustc-wrapper 让所有 cargo 命令自动走缓存（首次冷编依旧慢，但二次起会显著加速）。
# 2) macOS linker：使用 Xcode 15+ 的 ld-new。
# 3) Linux linker：可选 mold，见下方注释。
# 4) 测试：建议用 cargo-nextest（`cargo install cargo-nextest`），命令 `cargo nextest run -p <crate>`。

[build]
rustc-wrapper = "sccache"

[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-fuse-ld=/usr/bin/ld"]

# Linux: 使用 mold（需 brew install mold 或 apt install mold）
# [target.x86_64-unknown-linux-gnu]
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]
