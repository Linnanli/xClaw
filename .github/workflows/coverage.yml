# Code Coverage Workflow
#
# This workflow runs test coverage analysis and uploads reports to Codecov.
# Coverage reports help identify untested code paths and maintain code quality.
#
# What it does:
# - Runs unit and integration tests with coverage instrumentation
# - Runs E2E tests with coverage instrumentation
# - Uploads coverage reports to Codecov (https://codecov.io/gh/nearai/ironclaw)
#
# Viewing coverage reports:
# - PRs automatically get coverage comments showing changes in coverage
# - Visit https://codecov.io/gh/nearai/ironclaw for detailed coverage reports
# - Coverage reports are generated for three configurations:
#   1. all-features: Full feature set
#   2. default: Default features
#   3. libsql-only: Minimal libSQL-only configuration
# - E2E coverage tracks end-to-end test coverage separately
#
# Coverage files:
# - Unit/integration: lcov.info (uploaded to Codecov with "unit" flag)
# - E2E: e2e-coverage.info (uploaded to Codecov with "e2e" flag)
#
# Requirements:
# - Uses cargo-llvm-cov for coverage instrumentation
# - Requires PostgreSQL for integration tests (pgvector/pgvector:pg16)
# - E2E tests require Python 3.12 and Playwright

name: Code Coverage
on:
  push:
    branches: [xClaw]
  pull_request:
    branches: [xClaw]
    paths:
      - 'crates/dasclaw_cli/**'
      - 'crates/dasclaw_safety/**'
      - 'crates/dasclaw_runtime/**'
      - '.github/workflows/coverage.yml'

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  coverage:
    name: Coverage (${{ matrix.name }})
    # disabled in xClaw fork: this job's "Build WASM channels" step calls
    # ./scripts/build-wasm-extensions.sh inherited from ironclaw, which is not
    # present at the xClaw workspace root (the script only exists under
    # desktop-client/ironclaw/scripts/ and ironclaw-main/scripts/). The
    # channels-src/ WIT extensions are not active in this fork, so the
    # coverage matrix would always exit 127 at that step. Mirrors the same
    # `if: false` guard already applied in test.yml (wasm-wit-compat,
    # bench-compile). Re-enable when WASM channels return to xClaw.
    if: false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: all-features
            flags: "--all-features"
            has_postgres: true
          - name: default
            flags: ""
            has_postgres: true
          - name: libsql-only
            flags: "--no-default-features --features libsql"
            has_postgres: false
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ironclaw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage-${{ matrix.name }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install cargo-component
        run: |
          if ! command -v cargo-component >/dev/null 2>&1; then
            cargo install cargo-component --locked
          fi

      - name: Build WASM channels (for integration tests)
        run: ./scripts/build-wasm-extensions.sh --channels

      - name: Run database migrations
        if: matrix.has_postgres
        run: |
          set -euo pipefail
          readarray -t migration_files < <(printf '%s\n' migrations/V*.sql | sort -V)
          for f in "${migration_files[@]}"; do
            echo "Applying $f..."
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: ironclaw_test

      - name: Set DATABASE_URL for postgres configs
        if: matrix.has_postgres
        run: echo "DATABASE_URL=postgres://postgres:postgres@localhost/ironclaw_test" >> "$GITHUB_ENV"

      - name: Generate coverage
        run: cargo llvm-cov ${{ matrix.flags }} --workspace --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: ${{ matrix.name }}
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true

  e2e-coverage:
    name: E2E Coverage
    # disabled in xClaw fork: same reason as the `coverage` job above —
    # ./scripts/build-wasm-extensions.sh is not present at the xClaw
    # workspace root, so the "Build WASM channels" step would exit 127.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e-coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install cargo-component
        run: |
          if ! command -v cargo-component >/dev/null 2>&1; then
            cargo install cargo-component --locked
          fi

      - name: Build WASM channels
        run: ./scripts/build-wasm-extensions.sh --channels

      - name: Set up coverage instrumentation
        run: |
          # show-env outputs shell-quoted values (KEY='value') but GITHUB_ENV
          # expects unquoted KEY=value. Strip only the wrapping single quotes
          # from KEY='value' lines without altering any internal characters.
          cargo llvm-cov show-env | sed -E "s/^([A-Za-z_][A-Za-z0-9_]*)='(.*)'$/\1=\2/" >> "$GITHUB_ENV"

      - name: Clean coverage workspace
        run: cargo llvm-cov clean --workspace

      - name: Build instrumented binary
        run: cargo build --no-default-features --features libsql

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install E2E dependencies
        run: |
          cd tests/e2e
          pip install -e .
          playwright install --with-deps chromium

      - name: Run E2E tests
        run: |
          pytest tests/e2e/ -v -x --timeout=120
        env:
          RUST_LOG: ironclaw=info
          RUST_BACKTRACE: "1"

      - name: Verify profraw files exist
        if: always()
        run: |
          echo "LLVM_PROFILE_FILE=${LLVM_PROFILE_FILE}"
          echo "CARGO_LLVM_COV_TARGET_DIR=${CARGO_LLVM_COV_TARGET_DIR}"
          profraw_count=$(find target/ -name '*.profraw' 2>/dev/null | wc -l)
          echo "Found ${profraw_count} .profraw files under target/"
          find target/ -name '*.profraw' 2>/dev/null || true
          if [ "$profraw_count" -eq 0 ]; then
            echo "::warning::No .profraw files found — coverage report will fail"
          fi

      - name: Generate coverage report
        if: always()
        run: cargo llvm-cov report --lcov --output-path e2e-coverage.info

      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: e2e-coverage.info
          flags: e2e
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/e2e/screenshots/
          if-no-files-found: ignore

  coverage-dasclaw-core:
    # Lean coverage job for the xClaw fork's headless crates. Bypasses the
    # WASM channel build and PostgreSQL service that gate the legacy
    # ironclaw-flavored jobs above (which remain `if: false` until the
    # `scripts/build-wasm-extensions.sh` script returns to the xClaw root).
    # Scoped to the three crates that ADR-153 §1.1 + §2.1 cover end-to-end.
    name: Coverage (dasclaw-core lean)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
          # The dasclaw_wasm_tools build script compiles a wasm32-wasip2
          # fixture component (see crates/dasclaw_wasm_tools/build.rs +
          # tests/fixtures/minimal_http_component/). Without this target the
          # wasm_tools crate (which dasclaw_runtime/cli/safety transitively
          # link in tests) fails with E0463 "can't find crate for `core`".
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage-dasclaw-core

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Generate coverage
        run: |
          cargo llvm-cov nextest \
            -p dasclaw_cli \
            -p dasclaw_safety \
            -p dasclaw_runtime \
            --lcov --output-path lcov-dasclaw-core.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov-dasclaw-core.info
          flags: dasclaw-core
          disable_search: true
          use_oidc: true
          # Soft-fail on Codecov upload: the artifact itself is the source of
          # truth for the gate; Codecov outage should not block the merge
          # train. The artifact upload below preserves the lcov for review.
          fail_ci_if_error: false

      - name: Upload lcov artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov-dasclaw-core
          path: lcov-dasclaw-core.info
          if-no-files-found: error

  coverage-gate:
    name: Coverage
    runs-on: ubuntu-latest
    if: always()
    needs: [coverage, e2e-coverage, coverage-dasclaw-core]
    steps:
      - name: Evaluate coverage results
        run: |
          # Legacy `coverage` / `e2e-coverage` jobs are intentionally disabled
          # in the xClaw fork (see `if: false` guards above). Treat their
          # `skipped` result as acceptable, but still hard-fail on any real
          # failure. The lean `coverage-dasclaw-core` job is mandatory.
          set -euo pipefail
          fail=0
          if [[ "${{ needs.coverage-dasclaw-core.result }}" != "success" ]]; then
            echo "coverage-dasclaw-core failed: ${{ needs.coverage-dasclaw-core.result }}"
            fail=1
          fi
          for r in "${{ needs.coverage.result }}" "${{ needs.e2e-coverage.result }}"; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "Legacy coverage job in unexpected state: $r"
              fail=1
            fi
          done
          exit $fail
