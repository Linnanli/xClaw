name: Run Tests
on:
  workflow_call:
  pull_request:
    branches:
      - xClaw
    # xClaw fork: skip test job on doc-only PRs.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.kiro/**'
      - 'LICENSE*'
      - '.vscode/**'
      - '.github/ISSUE_TEMPLATE/**'
  push:
    branches:
      - xClaw

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests (${{ matrix.name }})
    # xClaw fork: PR triggers a single 'default' matrix slice (see matrix
    # below). Full multi-feature suite still only runs on push-to-xClaw and
    # workflow_call. This is the local-fast / CI-strict workflow handoff
    # described in AGENTS.md "本地快速开发节奏".
    #
    # NOTE: keep on `ubuntu-latest` (4 vCPU / 16GB). Migration to
    # `ubuntu-latest-large` / `ubuntu-22.04-8core` requires GitHub Larger
    # Runner billing approval; tracked separately. The dev profile +
    # mold linker + nextest combo below should keep peak link RAM under
    # 12GB so the standard runner no longer OOMs.
    runs-on: ubuntu-latest
    env:
      # sccache via GitHub Actions cache backend
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      # mold linker for x86_64-linux (huge RAM/time savings on the
      # 350+ rlib ironclaw lib-test link step). Scoped to Linux only.
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      CARGO_TERM_COLOR: always
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"name":"default","flags":""}]' || '[{"name":"all-features","flags":"--no-default-features --features postgres,libsql,html-to-markdown,bedrock,import"},{"name":"default","flags":""},{"name":"libsql-only","flags":"--no-default-features --features libsql"}]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          # need history to diff against base for path scoping
          fetch-depth: 0
      - name: Install Linux system dependencies (GTK / WebKit for Tauri desktop-client; libcap for dasclaw_sandbox_linux vendored bwrap)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            mold \
            pkg-config \
            libcap-dev
      # ADR-144 §5.4 — enable unprivileged user namespaces on the GHA runner
      # so that the `dasclaw_sandbox_linux` helper (vendored bwrap) can
      # `unshare(CLONE_NEWUSER)` without setuid. Mirrors codex's CI snippet
      # verbatim ([`codex-rs/.github/workflows/rust-ci-full.yml:644-655`]).
      # `apparmor_restrict_unprivileged_userns` only exists on Ubuntu 24.04+;
      # the conditional `grep` keeps the step compatible with older runners.
      - name: Enable unprivileged user namespaces (Linux)
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
          # save cache even on partial-match restore so next run benefits
          save-if: ${{ github.ref == 'refs/heads/xClaw' || github.event_name == 'workflow_call' }}
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.6
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # AGENTS.md §3: PR scope = touched crate, full workspace 由 push-to-xClaw 兜底。
      # 对 PR 事件，比较 base...HEAD 的改动文件，映射到 -p <crate> 列表；
      # 任何非 crate 路径（workspace Cargo.toml / scripts / desktop-client / submodule）
      # 触发 fallback 到 --workspace。
      - name: Compute changed-crate scope (PR only)
        id: scope
        if: github.event_name == 'pull_request' && matrix.name == 'default'
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base" "$head" || true)
          echo "Changed files:"; echo "$changed"
          fallback=0
          declare -A crates=()
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              crates/*)
                name=$(echo "$f" | cut -d/ -f2)
                crates[$name]=1 ;;
              admin-backend/*|desktop-client/*|claw-code/*|codex-cli-main/*|ironclaw-main/*|claw-decode-main/*|decode-claude-code-main/*|vendor/*)
                fallback=1 ;;
              Cargo.toml|Cargo.lock|build.rs|deny.toml|rust-toolchain.toml|.cargo/*)
                fallback=1 ;;
              *)
                # docs / .github / scripts → don't trigger compile
                ;;
            esac
          done <<< "$changed"
          if [ "$fallback" = "1" ] || [ ${#crates[@]} -eq 0 ]; then
            echo "scope=--workspace" >> "$GITHUB_OUTPUT"
            echo "Using --workspace (fallback or no crate-only change)"
          else
            args=""
            for c in "${!crates[@]}"; do args="$args -p $c"; done
            echo "scope=$args" >> "$GITHUB_OUTPUT"
            echo "Using scoped: $args"
          fi
      # ADR-144 §5.3 P1.2a + §5.4 — produce the `dasclaw-sandbox-linux`
      # helper binary that
      # `crates/dasclaw_sandbox/tests/req_kernel_enforces_read_only_subpaths_linux.rs`
      # auto-detects under `target/debug/`. Without this step the test
      # self-skips (helper missing) and we lose Linux kernel-enforcement
      # regression coverage. Built only when the scope actually exercises
      # the test surface (touches `dasclaw_sandbox` / `dasclaw_sandbox_linux`,
      # or uses the workspace fallback).
      - name: Build dasclaw_sandbox_linux helper (Wave-C1c P1.2a regression coverage)
        if: |
          contains(steps.scope.outputs.scope, 'dasclaw_sandbox') ||
          steps.scope.outputs.scope == '--workspace' ||
          steps.scope.outputs.scope == '' ||
          matrix.name != 'default'
        run: |
          set -euo pipefail
          # sccache fail-soft (mirrors the strategy used by `Run Tests` below):
          # GHA Cache backend has occasional outages; probe before use, fall
          # back to plain rustc if unavailable rather than failing the job.
          if ! sccache --start-server >/dev/null 2>&1; then
            echo "::warning::sccache unavailable; building helper without RUSTC_WRAPPER"
            unset RUSTC_WRAPPER
            unset SCCACHE_GHA_ENABLED
          fi
          cargo build -p dasclaw_sandbox_linux --bin dasclaw-sandbox-linux
      - name: Run Tests
        run: |
          set -euo pipefail
          # sccache fail-soft: GHA Cache backend has occasional outages
          # (HTTP 400 "Our services aren't available"). Probe before use;
          # if unavailable, fall back to plain rustc instead of failing the
          # whole job. Cache miss costs minutes; outage costs the whole PR.
          if ! sccache --start-server >/dev/null 2>&1; then
            echo "::warning::sccache unavailable (likely GHA Cache outage); disabling RUSTC_WRAPPER for this run"
            unset RUSTC_WRAPPER
            unset SCCACHE_GHA_ENABLED
          fi
          SCOPE="${{ steps.scope.outputs.scope || '--workspace' }}"
          echo "Test scope: $SCOPE"
          cargo nextest run $SCOPE ${{ matrix.flags }} --no-fail-fast
      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  heavy-integration-tests:
    name: Heavy Integration Tests
    # disabled in xClaw fork: Telegram WASM channel not active here.
    # re-enable by removing `if: false` once channels-src/telegram is wired up.
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          key: heavy-integration
      - name: Build Telegram WASM channel
        run: cargo build --manifest-path channels-src/telegram/Cargo.toml --target wasm32-wasip2 --release
      - name: Run thread scheduling integration tests
        run: cargo test --no-default-features --features libsql,integration --test e2e_thread_scheduling -- --nocapture
      - name: Run Telegram thread-scope regression test
        run: cargo test --features integration --test telegram_auth_integration test_private_messages_use_chat_id_as_thread_scope -- --exact

  telegram-tests:
    name: Telegram Channel Tests
    # disabled in xClaw fork: Telegram channel not active here.
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Telegram Channel Tests
        run: cargo test --manifest-path channels-src/telegram/Cargo.toml -- --nocapture

  windows-build:
    # xClaw fork: Windows build moved to its own workflow.
    # See .github/workflows/windows-ci.yml — runs on workflow_dispatch +
    # weekly schedule + push to main/refactor/* + push to feat/win-* /
    # ci/win-* branches. Decoupled from main PR cadence to keep iteration
    # fast; cross-platform regression is still protected by the dedicated
    # workflow.
    name: Windows Build (decoupled to windows-ci.yml)
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo "see .github/workflows/windows-ci.yml"

  wasm-wit-compat:
    name: WASM WIT Compatibility
    # disabled in xClaw fork: ./scripts/build-wasm-extensions.sh inherited from
    # ironclaw is not present at the xClaw workspace root, and channels-src/
    # WIT extensions are not active in this fork.
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-extensions
      - name: Install cargo-component
        run: cargo install cargo-component --locked || true
      - name: Build all WASM extensions against current WIT
        run: ./scripts/build-wasm-extensions.sh
      - name: Instantiation test (host linker compatibility)
        run: cargo test --all-features wit_compat -- --nocapture

  bench-compile:
    name: Benchmark Compilation
    # disabled in xClaw fork: benches inherited from ironclaw require Telegram /
    # channels infra that is not active in this fork.
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench
      - name: Compile benchmarks
        run: cargo bench --all-features --no-run

  docker-build:
    name: Docker Build
    # disabled in xClaw fork: Dockerfile inherited from ironclaw is not yet adapted
    # to the dasclaw_* workspace + 3 git submodules layout.
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Build Docker image
        run: docker build -t ironclaw-test:ci .

  version-check:
    name: Version Bump Check
    # disabled in xClaw fork: extension version-bump policy inherited from ironclaw
    # does not apply to the phase3 refactor cadence.
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Check version bumps for changed extensions
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: ./scripts/check-version-bumps.sh

  # Roll-up job for branch protection
  run-tests:
    name: Run Tests
    runs-on: ubuntu-latest
    if: always()
    needs: [tests, heavy-integration-tests, telegram-tests, wasm-wit-compat, docker-build, version-check, bench-compile]
    steps:
      - run: |
          # xClaw fork: tests are skipped on PR to keep iteration fast;
          # treat skipped as pass here, only fail on failure/cancelled.
          # Full suite still runs on push-to-xClaw. Windows build moved to
          # .github/workflows/windows-ci.yml — not part of this gate.
          for job in tests heavy-integration-tests telegram-tests wasm-wit-compat docker-build version-check bench-compile; do
            case "$job" in
              tests) result="${{ needs.tests.result }}" ;;
              heavy-integration-tests) result="${{ needs.heavy-integration-tests.result }}" ;;
              telegram-tests) result="${{ needs.telegram-tests.result }}" ;;
              wasm-wit-compat) result="${{ needs.wasm-wit-compat.result }}" ;;
              docker-build) result="${{ needs.docker-build.result }}" ;;
              version-check) result="${{ needs.version-check.result }}" ;;
              bench-compile) result="${{ needs.bench-compile.result }}" ;;
            esac
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "$job failed"
              exit 1
            fi
          done
