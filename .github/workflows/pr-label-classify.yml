name: "PR: Classify (Size, Risk, Contributor)"

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: read           # needed for search/issues API (contributor count)

jobs:
  classify:
    # Temporarily disabled: this workflow uses pull_request_target + checkout
    # base.ref, so it always runs the script from the BASE branch. The
    # pr-labeler.sh fix (multi-page jq accumulator) lives on the PR branch,
    # so the bug recurs here until the PR is merged into base.
    # Re-enable in a follow-up PR after this PR (which fixes pr-labeler.sh)
    # is merged into the xClaw default branch.
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Classify PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/pr-labeler.sh
