name: PR — Closes #issue check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: read
  contents: read

jobs:
  closes-link:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Detect plan-docs-only PR (exempt from closes-link)
        id: exempt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Plan docs (ADRs, execution plans, inventories under docs/plans/architecture-refactor/)
          # are reference material referenced by other PRs, not implementation of trackable
          # issues. Exempt PRs whose changes are entirely under that directory from the
          # closes-link check.
          files=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')
          if [ -z "$files" ]; then
            echo "exempt=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          non_plan=$(printf '%s\n' "$files" | grep -vE '^docs/plans/architecture-refactor/.*\.md$' || true)
          if [ -z "$non_plan" ]; then
            echo "All changed files are plan docs; exempting from closes-link check."
            echo "exempt=true" >> "$GITHUB_OUTPUT"
          else
            echo "exempt=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Require Closes/Fixes/Resolves #N in PR body
        if: steps.exempt.outputs.exempt != 'true'
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if [ -z "${BODY:-}" ]; then
            echo "::error::PR body is empty. Add 'Closes #<issue>' to link this PR to an issue."
            exit 1
          fi
          # Match GitHub's own closing keyword set (case-insensitive)
          # See: https://docs.github.com/en/issues/tracking-your-work-with-issues/linking-a-pull-request-to-an-issue
          if printf '%s' "$BODY" | grep -iEq '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+'; then
            echo "OK: PR body contains a closing keyword + #issue."
          else
            echo "::error::PR body must contain 'Closes #<issue>' (or Fixes/Resolves) so the project board state machine advances on merge. See .github/copilot-instructions.md §4."
            exit 1
          fi
