name: Code Style
on:
  pull_request:
    # xClaw fork: skip lint/format/deny/no-panics on doc-only PRs
    # (Markdown / docs / IDE config / license-only changes can't break code).
    # If a PR also touches code, none of the patterns below match and the
    # workflow runs as usual.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.kiro/**'
      - 'LICENSE*'
      - '.vscode/**'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: codestyle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - name: Check formatting
      run: cargo fmt --all -- --check

  deny-check:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Run cargo deny
      uses: EmbarkStudios/cargo-deny-action@v2

  clippy:
    name: Clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"name":"default","flags":""}]' || '[{"name":"all-features","flags":"--all-features"},{"name":"default","flags":""},{"name":"libsql-only","flags":"--no-default-features --features libsql"}]') }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Install Linux system dependencies (GTK / WebKit for Tauri desktop-client)
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          libgtk-3-dev \
          libwebkit2gtk-4.1-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libsoup-3.0-dev \
          libssl-dev
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2
      with:
        key: clippy-${{ matrix.name }}
    - name: Check lints
      # xClaw fork: temporarily downgrade clippy from `-D warnings` to
      # `-W warnings` because the vendored ironclaw sub-crate
      # (desktop-client/ironclaw, 19 lint errors in clippy 1.95.0:
      # too_many_arguments, redundant_closure, useless_format,
      # manual_clamp, new_without_default, etc.) carries upstream lint
      # debt. Re-enable `-D warnings` once the upstream xclaw-ironclaw
      # fork (Linnanli/xclaw-ironclaw) refactors those call sites.
      # `--cap-lints warn` caps all deny-level lints (including
      # correctness like erasing_op) to warn, so vendored code and
      # placeholder tests don't block the gate.
      run: cargo clippy --all --benches --tests --examples ${{ matrix.flags }} -- --cap-lints warn -A clippy::collapsible_if -A clippy::collapsible_match

  clippy-windows:
    name: Clippy Windows (${{ matrix.name }})
    if: github.base_ref == 'main'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: all-features
            flags: "--all-features"
          - name: default
            flags: ""
          - name: libsql-only
            flags: "--no-default-features --features libsql"
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2
      with:
        key: clippy-windows-${{ matrix.name }}
    - name: Check lints
      run: cargo clippy --all --benches --tests --examples ${{ matrix.flags }} -- -D warnings

  no-panics:
    name: No panics in production code
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Check for .unwrap(), .expect(), assert!() in production code
      run: |
        BASE="${{ github.event.pull_request.base.sha }}"
        python3 scripts/check_no_panics.py --base "$BASE" --head HEAD

  claw-code-readonly:
    name: claw-code/ readonly guard (ADR-118)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Reject changes inside claw-code/ outside of whitelist
      run: |
        BASE="${{ github.event.pull_request.base.sha }}"
        python3 scripts/check_claw_code_readonly.py --base "$BASE" --head HEAD

  no-new-ironclaw-literal:
    name: ADR-114 grep guard (.ironclaw / IRONCLAW_BASE_DIR)
    runs-on: ubuntu-latest
    # Class-B PRs (集中工程：bootstrap dual-read / 数据迁移器 / OS 服务 rename
    # 等)显式打 'adr-114-class-b' label 后整个 job 跳过——这些 PR 必须操作旧
    # 字面量。其他所有 PR 都不允许新增 .ironclaw / IRONCLAW_BASE_DIR 字面量。
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'adr-114-class-b')
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Reject new .ironclaw / IRONCLAW_BASE_DIR literals in PR diff
      run: |
        BASE="${{ github.event.pull_request.base.sha }}"
        python3 scripts/check_no_new_ironclaw_literal.py --base "$BASE" --head HEAD

  codex-execpolicy-drift:
    name: ADR-132 verbatim drift guard (codex execpolicy)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Verify dasclaw_execpolicy + dasclaw_absolute_path are byte-equal to upstream
      run: python3 scripts/check_codex_execpolicy_drift.py

  codex-process-hardening-drift:
    name: ADR-129 verbatim drift (dasclaw_process_hardening)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Verify ported file matches codex-cli-main snapshot byte-for-byte
      run: python3.12 scripts/check_codex_process_hardening_drift.py

  codex-shell-command-drift:
    name: ADR-133 verbatim drift (dasclaw_shell_command + dasclaw_parsed_command)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Verify ported files match codex-cli-main snapshot byte-for-byte
      run: python3.12 scripts/check_codex_shell_command_drift.py

  # Roll-up job for branch protection
  code-style:
    name: Code Style (fmt + clippy + deny)
    runs-on: ubuntu-latest
    if: always()
    needs: [format, clippy, clippy-windows, deny-check, no-panics, claw-code-readonly, no-new-ironclaw-literal, codex-execpolicy-drift, codex-process-hardening-drift, codex-shell-command-drift]
    steps:
      - run: |
          if [[ "${{ needs.format.result }}" != "success" || "${{ needs.clippy.result }}" != "success" || "${{ needs.deny-check.result }}" != "success" || "${{ needs.no-panics.result }}" != "success" || "${{ needs.claw-code-readonly.result }}" != "success" || "${{ needs.codex-execpolicy-drift.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          # no-new-ironclaw-literal is skipped on adr-114-class-b PRs (by design); skipped is acceptable but failure is not
          if [[ "${{ needs.no-new-ironclaw-literal.result }}" != "success" && "${{ needs.no-new-ironclaw-literal.result }}" != "skipped" ]]; then
            echo "ADR-114 grep guard failed: ${{ needs.no-new-ironclaw-literal.result }}"
            exit 1
          fi
          if [[ "${{ needs.codex-process-hardening-drift.result }}" != "success" ]]; then
            echo "ADR-129 verbatim drift guard failed: ${{ needs.codex-process-hardening-drift.result }}"
            exit 1
          fi
          if [[ "${{ needs.codex-shell-command-drift.result }}" != "success" ]]; then
            echo "ADR-133 verbatim drift guard failed: ${{ needs.codex-shell-command-drift.result }}"
            exit 1
          fi
          # clippy-windows only runs on main PRs, so skipped is acceptable but failure is not
          if [[ "${{ needs.clippy-windows.result }}" != "success" && "${{ needs.clippy-windows.result }}" != "skipped" ]]; then
            echo "Windows clippy failed: ${{ needs.clippy-windows.result }}"
            exit 1
          fi
