[package]
name = "dasclaw_mcp"
version = "0.0.0-w6"
edition = "2021"
description = "Model Context Protocol (MCP) client building blocks shared across dasclaw hosts."
license = "Apache-2.0 OR MIT"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
