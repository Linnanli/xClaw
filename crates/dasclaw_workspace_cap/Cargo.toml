[package]
name = "dasclaw_workspace_cap"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Capability-based workspace filesystem boundary for ironclaw agents"
authors = ["IronClaw Contributors"]
license = "MIT OR Apache-2.0"
publish = false

[package.metadata.dist]
dist = false

[dependencies]
# Capability-based FS (Bytecode Alliance, used by WASI / Deno)
cap-std = "4"

# Error handling
thiserror = "2"

# Policy serialization (W2.7).
# Note: TS / JsonSchema bindings intentionally left to the integrating crate
# (W2.6 dasclaw_core) so this base crate stays dependency-light.
serde = { version = "1", features = ["derive"] }

# Workspace memory modules (slice 3/N: privacy, document).
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
serde_json = "1"

# Embeddings + cache (slice 6/N: embeddings, embedding_cache). Mirrors
# ironclaw's existing versions; reqwest stays on the rustls-tls-native-roots
# minimal feature set (only JSON POST is needed for embedding providers).
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
lru = "0.16.3"
sha2 = "0.10"
tracing = "0.1"
# OpenAI embedding 429 handling reuses the shared `parse_retry_after` helper
# from the llm provider crate (no behavior change vs ironclaw).
dasclaw_llm_provider = { path = "../dasclaw_llm_provider" }

# Prompt-injection scanner (slice 7 preparatory: sanitization helpers used by
# Workspace write paths). Mirrors the dep already used by dasclaw_llm_provider.
dasclaw_safety = { path = "../dasclaw_safety" }

# PostgreSQL persistence (slice 5/N: repository). Optional, gated by `postgres`
# feature so default builds stay dependency-light. Mirrors ironclaw's existing
# `postgres` feature set (see desktop-client/ironclaw/Cargo.toml).
deadpool-postgres = { version = "0.14", optional = true }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"], optional = true }
postgres-types = { version = "0.2", features = ["with-serde_json-1"], optional = true }
pgvector = { version = "0.4", features = ["postgres"], optional = true }

[features]
default = []
# Enables `repository` module + PostgreSQL persistence (mirrors ironclaw's
# `postgres` feature; ADR-152 §3 F3.4 slice 5).
postgres = [
    "dep:deadpool-postgres",
    "dep:tokio-postgres",
    "dep:postgres-types",
    "dep:pgvector",
]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
