[package]
name = "dasclaw_llm_provider"
version = "0.0.0-w6"
edition = "2021"
description = "Main-repo native LLM provider — replaces claw-code-api path-dep per ADR-118."
license = "Apache-2.0 OR MIT"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# Core / serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"

# Async runtime + HTTP + SSE
tokio = { version = "1", default-features = false, features = ["time", "sync", "fs", "macros", "rt", "rt-multi-thread", "process", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls-native-roots", "stream"] }
async-trait = "0.1"
futures = "0.3"
bytes = "1"
eventsource-stream = "0.2"

# Provider / OAuth / config helpers ported from ironclaw
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
open = "5"
rand = "0.8"
regex = "1"
rust_decimal = { version = "1", features = ["serde", "serde-with-str", "maths"] }
rust_decimal_macros = "1"
secrecy = { version = "0.10", features = ["serde"] }
tracing = "0.1"
url = "2"
urlencoding = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
base64 = "0.22.1"
sha2 = "0.10"

# Workspace path-deps
dasclaw_core = { path = "../dasclaw_core" }

# AWS Bedrock provider (opt-in via `bedrock` feature)
aws-config = { version = "1", features = ["behavior-version-latest"], optional = true }
aws-sdk-bedrockruntime = { version = "1", optional = true }
aws-smithy-types = { version = "1", optional = true }

[features]
default = []
bedrock = ["dep:aws-config", "dep:aws-sdk-bedrockruntime", "dep:aws-smithy-types"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
wiremock = "0.6"
