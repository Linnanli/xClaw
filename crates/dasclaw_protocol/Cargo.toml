[package]
# Verbatim file-level slice of codex-cli-main/codex-rs/protocol/.
# Layers 1+2+3+4 (C1.2 ~ C1.5): parse_command + 14 leaves + config_types/openai_models
# cycle + Layer 3 hub (7 files) + error/error_tests.
# Mechanical edits per ADR-129 §1.3; rationale in ADR-136 §3.
# DO NOT hand-edit any vendored *.rs file — drift guard
# scripts/check_codex_protocol_drift.py verifies hash equality with upstream.
name = "dasclaw_protocol"
version = "0.0.0-w6"
edition = "2024"
description = "Verbatim file-level slice of codex-protocol (Layers 1+2+3+4; ADR-136 §3)."
license = "Apache-2.0 OR MIT"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
chardetng = "0.1.17"
chrono = { version = "0.4.43", features = ["serde"] }
dasclaw_absolute_path = { path = "../dasclaw_absolute_path" }
dasclaw_async_utils = { path = "../dasclaw_async_utils" }
dasclaw_execpolicy = { path = "../dasclaw_execpolicy" }
dasclaw_net_proxy = { path = "../dasclaw_net_proxy" }
dasclaw_utils_image = { path = "../dasclaw_utils_image" }
dasclaw_utils_string = { path = "../dasclaw_utils_string" }
encoding_rs = "0.8.35"
globset = "0.4"
icu_decimal = "2.1"
icu_locale_core = "2.1"
icu_provider = { version = "2.1", features = ["sync"] }
quick-xml = { version = "0.38.4", features = ["serialize"] }
reqwest = { version = "0.12", default-features = false }
schemars = "0.8.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3.17", features = ["macros", "base64"] }
strum = "0.27.2"
strum_macros = "0.28.0"
sys-locale = "0.3.2"
thiserror = "2"
tokio = { version = "1", features = ["rt"] }
tracing = "0.1.44"
ts-rs = { version = "11", features = ["serde-json-impl", "no-serde-warnings"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }

[dev-dependencies]
anyhow = "1"
http = "1.3.1"
pretty_assertions = "1"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.4"
seccompiler = "0.5.0"

[package.metadata.cargo-shear]
# `icu_provider` is required for its `sync` feature on `icu_decimal`'s
# `DecimalFormatter` (otherwise `OnceLock<DecimalFormatter>` rejects `Sync`).
# `strum` is re-exported by `strum_macros` in non-nightly builds (matches upstream).
ignored = ["icu_provider", "strum"]
