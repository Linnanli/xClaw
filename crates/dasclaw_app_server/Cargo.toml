[package]
name = "dasclaw_app_server"
version = "0.0.0-p0"
edition = "2024"
description = "Minimal local GUI control-plane host skeleton for dasclaw app-server."
license = "Apache-2.0 OR MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "dasclaw-app-server"
path = "src/main.rs"

[dependencies]
dasclaw_app_server_protocol = { path = "../dasclaw_app_server_protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
