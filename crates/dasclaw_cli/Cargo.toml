[package]
name = "dasclaw_cli"
version = "0.0.0-w6"
edition = "2024"
description = "Headless agent CLI binary (ADR-153 §4.4 step 4). Demonstrates dasclaw_runtime::Agent::builder() end-to-end without desktop dependencies (no Tauri, no database, no HTTP server)."
license = "MIT OR Apache-2.0"

[[bin]]
name = "dasclaw-cli"
path = "src/main.rs"

# ADR-153 §4.4 step 8 e2e: stdio MCP fixture used by tests/mcp_e2e.rs.
# Path lives under `tests/fixtures/` so scripts/check_no_panics.py treats
# it as test-only code. Not installed; cargo emits the binary purely to
# populate `CARGO_BIN_EXE_stdio_echo_mcp_fixture` for the integration test.
[[bin]]
name = "stdio_echo_mcp_fixture"
path = "tests/fixtures/stdio_echo_mcp.rs"
test = false
bench = false
doc = false

[lib]
path = "src/lib.rs"

[dependencies]
dasclaw_runtime = { path = "../dasclaw_runtime" }
dasclaw_core = { path = "../dasclaw_core" }
dasclaw_llm_provider = { path = "../dasclaw_llm_provider" }
# ADR-153 §4.4 sub-step 8: CLI wires MCP-backed ToolExecutor.
dasclaw_mcp = { path = "../dasclaw_mcp" }
dasclaw_tool = { path = "../dasclaw_tool" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
secrecy = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# W6.1: egress-gate feature is what lets dasclaw_safety::IronclawEgressGate
# implement dasclaw_core::EgressGate, which is the trait that test cases
# e7–e16 (ADR-153-cli-test-matrix §1) inject through run_with_tools_and_hooks.
# W6.5b B6: same crate also provides SafetyLayer::sanitize_for_stash, which is
# wired into the agent loop via the ToolOutputSanitizer seam (e22).
# Kept as dev-dependency: dasclaw_cli the library stays safety-stack-agnostic;
# downstream callers wire their own HookBundle from whichever safety crate
# they prefer.
dasclaw_safety = { path = "../dasclaw_safety", features = ["egress-gate"] }
dasclaw_governance = { path = "../dasclaw_governance" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
wiremock = "0.6"
