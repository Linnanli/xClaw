[package]
name = "dasclaw_cli"
version = "0.0.0-w6"
edition = "2024"
description = "Headless agent CLI binary (ADR-153 §4.4 step 4). Demonstrates dasclaw_runtime::Agent::builder() end-to-end without desktop dependencies (no Tauri, no database, no HTTP server)."
license = "MIT OR Apache-2.0"

[[bin]]
name = "dasclaw-cli"
path = "src/main.rs"

# ADR-153 §4.4 step 8 e2e: stdio MCP fixture used by tests/mcp_e2e.rs.
# Path lives under `tests/fixtures/` so scripts/check_no_panics.py treats
# it as test-only code. Not installed; cargo emits the binary purely to
# populate `CARGO_BIN_EXE_stdio_echo_mcp_fixture` for the integration test.
[[bin]]
name = "stdio_echo_mcp_fixture"
path = "tests/fixtures/stdio_echo_mcp.rs"
test = false
bench = false
doc = false

[lib]
path = "src/lib.rs"

# ADR-153 §1.1 A7 / #867: `wasm-tools` feature gates the optional
# `--wasm-tool` CLI flag and its dependency on `dasclaw_wasm_tools`
# (which pulls in wasmtime, ~50–80 MB to the shipped binary). Default-on
# so the headless CLI keeps its W6.6c e13 capability story; downstream
# consumers that want a leaner binary can opt out with
# `--no-default-features`.
[features]
default = ["wasm-tools"]
wasm-tools = ["dep:dasclaw_wasm_tools"]

[dependencies]
dasclaw_runtime = { path = "../dasclaw_runtime" }
dasclaw_core = { path = "../dasclaw_core" }
dasclaw_llm_provider = { path = "../dasclaw_llm_provider" }
# ADR-153 §4.4 sub-step 8: CLI wires MCP-backed ToolExecutor.
dasclaw_mcp = { path = "../dasclaw_mcp" }
dasclaw_tool = { path = "../dasclaw_tool" }
# ADR-153 §1.1 A6 / e12 binary-level slice (#868):
# `dasclaw-cli sandbox-exec` runs `/bin/bash -c <cmd>` under the headless
# CLI's default-deny ReadOnly policy. The three crates below were
# previously dev-only (library-seam e2e in tests/) but become runtime
# deps now that the subcommand ships in the binary.
dasclaw_exec = { path = "../dasclaw_exec" }
dasclaw_sandbox = { path = "../dasclaw_sandbox" }
dasclaw_workspace_cap = { path = "../dasclaw_workspace_cap" }
# Optional: only pulled in when the `wasm-tools` feature is enabled. See
# the `[features]` block above for the binary-size rationale.
dasclaw_wasm_tools = { path = "../dasclaw_wasm_tools", optional = true }
# ADR-153 §1.1 A6 (issue #868): `--enable-shell-tool` wires the
# in-tree ShellTool through ToolToExecutorAdapter so headless agents
# get the same sandboxed write-deny default that desktop ironclaw
# enforces. Kept as a prod dep (not dev) because main.rs constructs
# the tool at startup when the user passes the flag.
dasclaw_shell_tools = { path = "../dasclaw_shell_tools" }
# ADR-153 §1.1 B6 / e22 / issue #882: the binary defaults to wiring
# `SafetyLayer::sanitize_for_stash` through the `ToolOutputSanitizer`
# seam so the LLM never sees raw tool output that contains secrets.
# The `sanitizer` module exposes `SafetyStashSanitizer` as the default
# adapter; callers that want a different safety stack can still go
# through `Agent::builder().tool_output_sanitizer(...)` directly. The
# `egress-gate` feature is also what lets `IronclawEgressGate`
# implement `dasclaw_core::EgressGate` for the e7–e16 hook tests.
dasclaw_safety = { path = "../dasclaw_safety", features = ["egress-gate"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
secrecy = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# W6.1 e7–e16: the `egress-gate` feature is enabled via the production
# dependency above. `dasclaw_safety` itself is now a `[dependencies]`
# entry so the binary's default `SafetyStashSanitizer` can be wired
# without forcing every downstream lib consumer to opt into the safety
# stack. See the `[dependencies]` comment for the rationale.
#
# `tool_visibility` feature enables the ADR-149 `ToolVisibilityPolicy`
# trait + closed-enum surface; consumed by tests/governance_tool_visibility_e2e.rs
# to pin downstream-consumer wiring of the gate from the CLI side.
dasclaw_governance = { path = "../dasclaw_governance", features = ["tool_visibility"] }
# PR2 GUI-only blind-spot coverage: `dasclaw_channels` and `dasclaw_routines`
# are consumed only by the GUI today. The two e2e files below pin their
# public surface from a non-GUI consumer so cross-crate breakage shows up
# in the CLI test matrix (closes the headless gap called out in ADR-153 §1).
dasclaw_channels = { path = "../dasclaw_channels" }
dasclaw_routines = { path = "../dasclaw_routines" }
# W6.4 e11 (ADR-153 §1.1, A5 L1 path-escape) plus binary-level A6/e12
# (#868): `dasclaw_workspace_cap` is now a runtime dep (see
# [dependencies]); the dev-deps row is intentionally omitted to avoid
# duplicate-listing.
# W6.4b-i (ADR-153 §1.1 e14, outbound HTTP credential injection):
# tests/safety_credential_boundary_e2e.rs builds HttpTool with a
# SharedCredentialRegistry + InMemorySecretsStore, then uses an
# HttpInterceptor short-circuit to assert the secret is injected into
# the outbound request without touching the real network (the host
# SSRF blocklist refuses 127.0.0.1, so wiremock is not usable here).
dasclaw_net_tools = { path = "../dasclaw_net_tools" }
# W6.6c (ADR-153 §1.1 A7 / e13): wasm fixture also reused by the prod
# `--wasm-tool` flag e2e in tests/cli_wasm_tool_flag_e2e.rs.
dasclaw_wasm_tools = { path = "../dasclaw_wasm_tools" }
# W6.6b (ADR-153 §1.1 A6 / e12) library-seam test in
# tests/safety_sandbox_default_deny_e2e.rs reuses the same crates that
# the binary now consumes (`dasclaw_exec`, `dasclaw_sandbox`); see
# [dependencies] above.
# #868 binary-level slice (ADR-153 §1.1 A6 / e12):
# tests/cli_sandbox_default_deny_e2e.rs drives the real `dasclaw-cli`
# binary via `assert_cmd` to pin the on-deny exit-code + stderr
# contract.
assert_cmd = "2"
# Issue #895: deterministic timestamp/UUID construction for the
# `dasclaw_channels` JSON snapshot tests in
# tests/channels_status_contract_e2e.rs. `serde` features pulled in so the
# fixtures match the production serializers.
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
# Issue #895 + PR3 demo: snapshot pinning of `dasclaw_channels` JSON wire
# shapes (tests/channels_status_contract_e2e.rs) and the `dasclaw-cli --help`
# surface (tests/insta_snapshot_demo_e2e.rs). Version is centrally pinned
# via the root `[workspace.dependencies]` table (issues #898 / #899); the
# `json` feature is enabled there for all workspace consumers.
insta = { workspace = true }
predicates = "3"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util", "sync"] }
wiremock = "0.6"
# PR3 demo: insta snapshot testing. One demo test in
# tests/insta_snapshot_demo_e2e.rs pins the `dasclaw-cli --help` output so
# unintended CLI surface drift surfaces as a snapshot diff. Other tests
# can opt in by adding their own `insta::assert_snapshot!(...)` calls and
# committing the generated `tests/snapshots/*.snap` baseline.
# Issue #911 (B5 — claw-code interop demo on GUI path): the example
# `examples/claw_code_interop.rs` and the matching e2e
# `tests/claw_code_interop_e2e.rs` wire `BashValidationHook` as
# `HookBundle.egress`, then have the scripted tool executor delegate to
# `dasclaw_apply_patch::{parse_patch, apply}` for the `apply_patch`
# tool. Both the example and the e2e drive the shared demo entry point
# `dasclaw_cli::claw_code_interop_demo::run_demo`.
dasclaw_hooks = { path = "../dasclaw_hooks" }
dasclaw_bash_validation = { path = "../dasclaw_bash_validation" }
dasclaw_apply_patch = { path = "../dasclaw_apply_patch" }

# Issue #911 (B5): executable proof for the three-lineage fusion on the
# GUI/headless agent path. See `docs/INTEROP_DASCLAW.md` for the
# claw-code → dasclaw_* concept map this example demonstrates.
[[example]]
name = "claw_code_interop"
path = "examples/claw_code_interop.rs"
