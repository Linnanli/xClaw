[package]
name = "x_claw_agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Agent runtime fork of claw-code with x-claw specific Hook trait boundary"
authors = ["x-claw contributors"]
license = "MIT OR Apache-2.0"
publish = false

[package.metadata.dist]
dist = false

[lib]
name = "x_claw_agent"
path = "src/lib.rs"

[dependencies]
# Hook trait 层依赖。保持最小集，不拉 ironclaw/claw-code 业务代码。
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
