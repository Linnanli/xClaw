[package]
# ADR-139 §4 — MITM CA trust-chain manager.
#
# This crate is **dasclaw original code**, not a verbatim port from codex
# upstream (codex does not implement this layer). It centralizes:
#   - CA install / uninstall / rotation against per-user OS keychains
#   - env-var fallback (`SSL_CERT_FILE` / `REQUESTS_CA_BUNDLE` / `NODE_EXTRA_CA_CERTS`)
#   - status / export utilities
#
# Implementation is cfg-gated per platform (macOS / Windows / Linux). PR1
# shipped the API surface + module skeleton with all platform entry points
# returning `Err(Error::NotImplemented)`. PR2 (this commit) wires macOS +
# Windows keychain code; PR3 wires Linux NSS DB. See ADR-139 §4.5.
name = "dasclaw_cert_trust"
version = "0.0.0-w8"
edition = "2024"
description = "MITM CA trust-chain manager (per-user keychain + env-var fallback)."
license = "Apache-2.0 OR MIT"
publish = false

[lib]
name = "dasclaw_cert_trust"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
# PR2 (ADR-139 §4.5) — PEM↔DER decoding, SHA-256 fingerprinting, and
# base64 encoding (for `export` PEM rewrap) are cross-platform, so they
# live in `[dependencies]` (not cfg-gated).
rustls-pemfile = "2"
sha2 = "0.10"
base64 = "0.22"
dirs = "6"
# X.509 body validation before installing a CA — issue #375. Rejects
# leaf certs (BasicConstraints CA:FALSE), expired CAs (notAfter in the
# past), and non-self-signed intermediates so the caller cannot promote
# an arbitrary cert into the OS root store. Already a transitive
# dependency via the rustls-pki-types ecosystem; promoting to a direct
# dependency lets us call the parser API explicitly.
x509-parser = "0.18"
# RFC 3339 formatting of `notAfter` extracted from the installed CA so
# `dasclaw cert status` can report a real expiry instead of `None`. We
# only need `formatting` + `parsing` of `OffsetDateTime`; already
# transitively present (rcgen / hyper-rustls), so promoting to a direct
# dependency adds no new tree. Issue #376 §3.4.
time = { version = "0.3", default-features = false, features = ["formatting"] }
# Atomic fingerprint sentinel writes (tempfile + rename) — see
# `paths::write_fingerprint`. A non-atomic write would let a mid-write
# crash leave the file truncated while the OS keychain still trusts the
# CA, breaking `status()` round-trip semantics.
tempfile = "3"

# macOS — per-user login keychain via `security-framework`.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

# Unix sentinel-permission audit (issue #376 §3.1) needs `getuid()` to
# verify the fingerprint file is still owned by the dasclaw user. `libc`
# is already in the workspace lockfile via `tempfile`/`rcgen`/etc., so
# this adds no new transitive tree.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows — `CurrentUser\Root` cert store via `windows-rs`.
[target.'cfg(target_os = "windows")'.dependencies]
# Locked at 0.58 to match the rest of the dasclaw workspace
# (desktop-client/Cargo.toml, desktop-client/ironclaw/Cargo.toml,
# crates/dasclaw_sandbox_windows/Cargo.toml). ADR-139 §3.5 mentions 0.59
# as a target; that bump must be coordinated workspace-wide.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
] }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
# rcgen builds tailored X.509 fixtures (leaf / expired / non-self-signed)
# for `pem::validate_root_ca` tests. Already in the workspace lockfile
# via desktop-client/dasclaw_net_proxy, so adding it as a dev-dep does
# not pull in a new transitive tree.
rcgen = "0.14"
time = "0.3"
