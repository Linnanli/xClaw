[package]
name = "dasclaw_core"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Agent runtime fork of claw-code with x-claw specific Hook trait boundary"
authors = ["x-claw contributors"]
license = "MIT OR Apache-2.0"
publish = false

[package.metadata.dist]
dist = false

[lib]
name = "dasclaw_core"
path = "src/lib.rs"

[dependencies]
# Hook trait 层依赖。保持最小集，不拉 ironclaw/claw-code 业务代码。
async-trait = "0.1"
futures-core = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# messages 模块依赖
tracing = "0.1"
# session / undo / task 依赖
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
# context::memory 依赖 (ADR-152 §3 F3.6 slice 1, ActionRecord.cost / Memory.total_cost)
rust_decimal = { version = "1", features = ["serde"] }
# session 的 truncate_preview helper
ironclaw_common = { path = "../../desktop-client/ironclaw/crates/ironclaw_common", version = "0.1.0" }
# session_manager 需要 RwLock/Mutex/spawn (fire-and-forget hooks)
tokio = { version = "1", features = ["sync", "rt", "time"] }
# W10.1: AgenticLoop accepts a borrowed CancellationToken so the loop can
# short-circuit when the host cancels mid-iteration.
tokio-util = "0.7"
# Project doc 注入 (#59b / ADR-115): SessionManager 构建期 DI 调用
# `LayeredProjectDocLoader` + `assemble_section`，不进 hook 系统。
dasclaw_project_docs = { path = "../dasclaw_project_docs", version = "0.0.0-w1" }
# ADR-148 EgressGate: 数据出口闸门 trait seam（取代 SafetyHook）。
# 仅依赖 dasclaw_governance::egress（always-on，无 feature gate）。
dasclaw_governance = { path = "../dasclaw_governance", version = "0.0.0-w1" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync"] }
tempfile = "3"
# Snapshot tests pin the GUI/IPC JSON wire shape for serde derives added in
# issue #909. Version centrally pinned via [workspace.dependencies] (PR #903).
insta = { workspace = true }
futures-util = "0.3"
