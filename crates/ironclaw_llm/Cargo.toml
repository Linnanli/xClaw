[package]
name = "ironclaw_llm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "LLM provider abstraction layer extracted from ironclaw"
license = "MIT OR Apache-2.0"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["time", "sync", "macros"] }
futures = "0.3"
async-trait = "0.1"

# HTTP client + SSE
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
eventsource-stream = "0.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# LLM framework
rig-core = "0.30"

# Utilities
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde", "serde-with-str", "maths"] }
rust_decimal_macros = "1"
secrecy = { version = "0.10", features = ["serde"] }
regex = "1"
sha2 = "0.10"
rand = "0.8"
url = "2"
dirs = "6"

# AWS Bedrock (optional)
aws-config = { version = "1", features = ["behavior-version-latest"], optional = true }
aws-sdk-bedrockruntime = { version = "1", optional = true }
aws-smithy-types = { version = "1", optional = true }

# NearAI / Codex / OAuth (optional)
open = { version = "5", optional = true }
bytes = { version = "1", optional = true }
urlencoding = { version = "2", optional = true }

[features]
default = []
bedrock = ["dep:aws-config", "dep:aws-sdk-bedrockruntime", "dep:aws-smithy-types"]
nearai = []
codex = ["dep:open", "dep:bytes"]
oauth = ["dep:urlencoding"]
recording = []
full = ["nearai", "codex", "oauth", "recording"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
