[package]
name = "ironclaw_auth"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Shared authentication module for JWT and password hashing"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/nearai/ironclaw"
repository = "https://github.com/nearai/ironclaw"
publish = false

[package.metadata.dist]
dist = false

[dependencies]
# Password hashing
argon2 = { version = "0.5", features = ["std"] }

# JWT tokens
# v10 requires explicit backend selection; pick `rust_crypto` to avoid
# pulling in the aws_lc_sys C build toolchain.
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }

# Time handling
chrono = "0.4"

# Random number generation
rand = "0.8"

# Serialization
serde = { version = "1", features = ["derive"] }

# Error handling
thiserror = "2"

[dev-dependencies]
proptest = "1"
