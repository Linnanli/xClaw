[package]
name = "dasclaw_bash_validation"
version = "0.0.0-w1"
edition = "2021"
description = "Bash injection detection (6 validation modules from claw-code)."
license = "Apache-2.0 OR MIT"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
dasclaw_shell_command = { path = "../dasclaw_shell_command" }
once_cell = "1.20"
regex = "1.12"
# Used by `readonly::bash_allowlist::is_command_safe_via_flag_parsing` to
# tokenize commands with POSIX shell-quote semantics (Phase 3.2.B port of
# `tryParseShellCommand`'s string-output path).
shell-words = "1.1"
thiserror = "1"
# Only used to name the `tree_sitter::Tree` type returned by
# `dasclaw_shell_command::bash::try_parse_shell`. We deliberately do NOT
# depend on `tree-sitter-bash` here — the grammar wiring lives in
# `dasclaw_shell_command` as the single AST source (plan §4.2).
tree-sitter = "0.25.10"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
