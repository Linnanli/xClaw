[package]
name = "dasclaw_net_tools"
version = "0.0.0-w6"
edition = "2024"
description = "Network/web LLM tools (web_fetch, …) extracted from desktop-client/ironclaw per ADR-156 §6.3 F4.6.8."
license = "Apache-2.0 OR MIT"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
bytes = "1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "fs", "io-util"] }
tracing = "0.1"

dasclaw_fs_tools = { path = "../dasclaw_fs_tools" }
dasclaw_runtime = { path = "../dasclaw_runtime" }
dasclaw_safety = { path = "../dasclaw_safety" }
dasclaw_tool = { path = "../dasclaw_tool" }
dasclaw_wasm_tools = { path = "../dasclaw_wasm_tools" }

# Optional readability + HTML→markdown pipeline used by `html_converter`
# (gated behind the `html-to-markdown` feature so headless builds stay slim).
html-to-markdown-rs = { version = "2.3", optional = true }
readabilityrs = { version = "0.1.2", optional = true }

[features]
# F4.6.8 phase 2: html_converter passthrough by default; opt-in for full
# readability + markdown conversion (also forwarded from desktop-client).
default = []
html-to-markdown = ["dep:html-to-markdown-rs", "dep:readabilityrs"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
