[package]
name = "dasclaw_hooks"
version = "0.1.0"
edition = "2024"
description = "Unified hook engine — single orchestration entry for the agent runtime (P0-3, ADR-113)."
license = "Apache-2.0 OR MIT"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["sync", "macros", "time", "rt"] }
tracing = "0.1"

# Reexport `x_claw_agent` trait seams so `dasclaw_hooks` becomes the single
# front-door for both event-style hooks and trait-seam hooks. See ADR-113.
x_claw_agent = { path = "../x_claw_agent", version = "0.1.0" }

# Phase 2.1 bash command-injection detection engine (Slice 2.1.d wires it
# into `BashValidationHook::before_tool_call`).
dasclaw_bash_validation = { path = "../dasclaw_bash_validation", version = "0.0.0-w1" }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "macros", "time", "rt", "rt-multi-thread"] }
tracing-test = { version = "0.2", features = ["no-env-filter"] }
