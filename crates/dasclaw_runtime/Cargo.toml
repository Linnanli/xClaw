[package]
name = "dasclaw_runtime"
version = "0.0.0-w6"
edition = "2024"
description = "Runtime (application-layer) building blocks for any dasclaw host: errors that carry the failing tool's identity, job state machine, future JobContext trait extension, etc."
license = "MIT OR Apache-2.0"

[dependencies]
dasclaw_tool = { path = "../dasclaw_tool" }
# `dasclaw_core::SecretProvider` trait used by the
# `secrets::agent_provider::AgentSecrets` adapter (F3.2 phase 2 PR 4c, #641).
dasclaw_core = { path = "../dasclaw_core" }
# `agent::LlmProviderResponder` adapts any `LlmProvider` impl into the
# `AgentResponder` trait (ADR-153 step 2 sub-step A2).
dasclaw_llm_provider = { path = "../dasclaw_llm_provider" }
thiserror = "1"
rust_decimal = { version = "1", features = ["serde", "serde-with-str", "maths"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
secrecy = { version = "0.10", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"

# OS keychain integration (`secrets::keychain`).
# Mirrors ironclaw's per-target deps; pulled in only when targeting the
# matching OS so that other dasclaw hosts pay zero cost.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "4", features = ["rt-tokio-crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
] }

# Optional Postgres backend for `SecretsStore` (`secrets::store_postgres`).
[dependencies.deadpool-postgres]
version = "0.14"
optional = true

[dependencies.tokio-postgres]
version = "0.7"
features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"]
optional = true

# Optional libSQL backend for `SecretsStore` (`secrets::store_libsql`).
[dependencies.libsql]
version = "0.6"
optional = true
default-features = false
features = ["core", "replication", "remote", "tls"]

[features]
default = []
postgres = ["dep:deadpool-postgres", "dep:tokio-postgres"]
libsql = ["dep:libsql"]

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
