[package]
name = "dasclaw_git_tools"
version = "0.0.0-w6"
edition = "2024"
description = "Git operation toolset (status/diff/log/branch/commit/push/stale) shelling out to git CLI via shared runner."
license = "Apache-2.0 OR MIT"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "io-util", "macros", "rt"] }
dasclaw_runtime = { path = "../dasclaw_runtime" }
dasclaw_tool = { path = "../dasclaw_tool" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
