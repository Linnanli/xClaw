[package]
name = "dasclaw_sandbox"
version = "0.0.0-w1"
edition = "2021"
description = "Cross-platform sandbox (Linux landlock / macOS seatbelt / Windows job-object)."
license = "Apache-2.0 OR MIT"
publish = false

[lib]
path = "src/lib.rs"

# ADR-131 / Slice B1 — `dasclaw-sandbox-resource-launcher` binary.
# 详见 docs/plans/architecture-refactor/adr-131-windows-job-object-resource-limits-wrapper.md。
# 在非 Windows 平台编译为 stub main（cfg-gated），保证 workspace 全平台
# `cargo build` 可靠通过（ADR-131 §7 Q4 决议方案 (a)）。
[[bin]]
name = "dasclaw-sandbox-resource-launcher"
path = "src/bin/resource_launcher_win.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
url = "2"

# ADR-141 §6 OQ-3/OQ-4 — structured per-spawn audit events for enterprise
# soft-mode allows. Emitted by the Windows backend when the caller has
# opted into `enterprise_allow_userspace_carveouts = true`. Re-uses the
# existing tracing taxonomy rather than introducing a new
# `dasclaw_observability` event type (OQ-3 sign-off 2026-05-11).
tracing = "0.1"

# #324 sub-task 1 — Pre-main process hardening for the
# `dasclaw-sandbox-resource-launcher` binary. Wired via `#[ctor::ctor]` at the
# top of `src/bin/resource_launcher_win.rs`. Pattern matches codex
# `responses-api-proxy/src/main.rs:4-7`. Hardening is no-op on platforms
# without a matching backend (lib.rs §pre_main_hardening cfg dispatch).
dasclaw_process_hardening = { path = "../dasclaw_process_hardening" }
ctor = "0.2"

# ADR-135 §3 Wave-C2a — NetworkProxy 通过 SandboxExecRequest 透传给
# seatbelt sbpl 合成器，恢复 `HTTP_PROXY=http://127.0.0.1:PORT` 的洞穿能力
# （allow_network=false 时的本地代理出口）。Linux 路径已通过
# `proxy_loopback_ports` Vec<u16> 间接消费；macOS 路径在 PR-C2a 接上。
# 详见 docs/plans/architecture-refactor/adr-135-sandboxing-crate-adoption-eval.md §3 PR-C2。
dasclaw_net_proxy = { path = "../dasclaw_net_proxy" }

# W3.3 — `libc` 现需在所有 Unix 平台启用（macOS + Linux），用于 setrlimit。
# 详见 docs/plans/architecture-refactor/45-resource-limits-adr.md。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# ADR-135 §3 Wave-C1 — 内核层 Seatbelt sbpl 合成委托给 dasclaw_sandboxing。
# 仅在 macOS target 启用；Linux 路径见 Wave-C3（需要 codex-linux-sandbox binary 落地），
# Windows 不涉及（无对应内核 backend）。
#
# 详见 docs/plans/architecture-refactor/adr-135-sandboxing-crate-adoption-eval.md §3 PR-C1。
[target.'cfg(target_os = "macos")'.dependencies]
dasclaw_sandboxing = { path = "../dasclaw_sandboxing" }
dasclaw_protocol = { path = "../dasclaw_protocol" }
dasclaw_absolute_path = { path = "../dasclaw_absolute_path" }

# W2.3 — Linux seccomp backend.
# 只在 Linux target 上启用，避免污染 macOS/Windows 工作流。
# 选型理由（详见 docs/plans/architecture-refactor/32 §W2.3）：
#   - codex `linux-sandbox` 的主路径是 bubblewrap (2,005 LOC) + seccomp (343 LOC)；
#     landlock 在 codex 自己已经标注为 legacy/backup。
#   - 文件系统限制由进程内 `ironclaw_workspace_cap` (cap-std) 兜底，
#     与 dasclaw_sandbox kernel 层互补不重叠。
#   - 不引入外部 bwrap setuid 依赖，部署更轻。
#
# ADR-144 §5.3 P1.2a — `dasclaw-sandbox-linux` helper wiring：当
# `SandboxBackendConfig.linux_sandbox_exe = Some(exe)` 时，把 user command
# 包装成 `[exe, --..., --, user_cmd]` argv（与 codex landlock.rs 同形），
# 把 FS 隔离 + seccomp 委托给 helper 内部完成；adapter 自身只保留 rlimit
# / cgroup 等父进程层。argv 合成走 `dasclaw_sandboxing::landlock`。
[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.5"
dasclaw_sandboxing = { path = "../dasclaw_sandboxing" }
dasclaw_protocol = { path = "../dasclaw_protocol" }
dasclaw_absolute_path = { path = "../dasclaw_absolute_path" }

# W2.4 — Windows restricted-token backend (adapter to `dasclaw_sandbox_windows`).
# 仅在 Windows target 启用，承接 `SandboxType::WindowsRestrictedToken`。
# 详见 docs/plans/architecture-refactor/49-... 与 issue #320 (Phase 1.2)。
[target.'cfg(target_os = "windows")'.dependencies]
dasclaw_sandbox_windows = { path = "../dasclaw_sandbox_windows" }
dirs = "6"

# ADR-131 / Slice B3 — base64 编码 launcher IPC 的 stdout / stderr 字节流。
# 仅 Windows 用：launcher binary 编码 + adapter launcher_client 解码。
base64 = "0.22"

# ADR-131 / Slice B2 — Outer Job Object FFI for resource limits wrapper.
# 仅在 Windows target 启用；features 与 dasclaw_sandbox_windows 0.52 对齐。
# JobObjects = CreateJobObjectW / SetInformationJobObject / AssignProcessToJobObject
# Foundation = HANDLE / CloseHandle / GetLastError
# Threading  = GetCurrentProcess
[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
version = "0.52"
features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
]

# Wave-C1 contract test for kernel 洞中洞 enforcement (tests/req_kernel_*).
# Wave-C2a contract test for proxy_loopback_ports threading through to
# seatbelt argv (tests/req_macos_proxy_loopback_threads_through_seatbelt.rs).
[target.'cfg(target_os = "macos")'.dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync"] }
async-trait = "0.1"
anyhow = "1"

# Wave-C1c P1.2a contract test for kernel-enforced read_only_subpaths via
# the dasclaw-sandbox-linux helper (bubblewrap + landlock V3),
# tests/req_kernel_enforces_read_only_subpaths_linux.rs.
[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile = "3"

