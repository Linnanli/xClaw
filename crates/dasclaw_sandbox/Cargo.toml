[package]
name = "dasclaw_sandbox"
version = "0.0.0-w1"
edition = "2021"
description = "Cross-platform sandbox (Linux landlock / macOS seatbelt / Windows job-object)."
license = "Apache-2.0 OR MIT"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
thiserror = "1"
url = "2"

# W3.3 — `libc` 现需在所有 Unix 平台启用（macOS + Linux），用于 setrlimit。
# 详见 docs/plans/architecture-refactor/45-resource-limits-adr.md。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# W2.3 — Linux seccomp backend.
# 只在 Linux target 上启用，避免污染 macOS/Windows 工作流。
# 选型理由（详见 docs/plans/architecture-refactor/32 §W2.3）：
#   - codex `linux-sandbox` 的主路径是 bubblewrap (2,005 LOC) + seccomp (343 LOC)；
#     landlock 在 codex 自己已经标注为 legacy/backup。
#   - 文件系统限制由进程内 `ironclaw_workspace_cap` (cap-std) 兜底，
#     与 dasclaw_sandbox kernel 层互补不重叠。
#   - 不引入外部 bwrap setuid 依赖，部署更轻。
[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.5"

# W2.4 — Windows restricted-token backend (adapter to `dasclaw_sandbox_windows`).
# 仅在 Windows target 启用，承接 `SandboxType::WindowsRestrictedToken`。
# 详见 docs/plans/architecture-refactor/49-... 与 issue #320 (Phase 1.2)。
[target.'cfg(target_os = "windows")'.dependencies]
dasclaw_sandbox_windows = { path = "../dasclaw_sandbox_windows" }
dirs = "6"
serde_json = "1"

# ADR-131 / Slice B2 — Outer Job Object FFI for resource limits wrapper.
# 仅在 Windows target 启用；features 与 dasclaw_sandbox_windows 0.52 对齐。
# JobObjects = CreateJobObjectW / SetInformationJobObject / AssignProcessToJobObject
# Foundation = HANDLE / CloseHandle / GetLastError
# Threading  = GetCurrentProcess
[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
version = "0.52"
features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
]
