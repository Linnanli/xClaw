[package]
name = "ironclaw_workspace_cap"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Capability-based workspace filesystem boundary for ironclaw agents"
authors = ["IronClaw Contributors"]
license = "MIT OR Apache-2.0"
publish = false

[package.metadata.dist]
dist = false

[dependencies]
# Capability-based FS (Bytecode Alliance, used by WASI / Deno)
cap-std = "4"

# Error handling
thiserror = "2"

# Policy serialization (W2.7).
# Note: TS / JsonSchema bindings intentionally left to the integrating crate
# (W2.6 dasclaw_core) so this base crate stays dependency-light.
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
