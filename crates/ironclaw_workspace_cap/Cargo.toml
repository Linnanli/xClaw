[package]
name = "ironclaw_workspace_cap"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Capability-based workspace filesystem boundary for ironclaw agents"
authors = ["IronClaw Contributors"]
license = "MIT OR Apache-2.0"
publish = false

[package.metadata.dist]
dist = false

[dependencies]
# Capability-based FS (Bytecode Alliance, used by WASI / Deno)
cap-std = "4"

# Error handling
thiserror = "2"

[dev-dependencies]
tempfile = "3"
