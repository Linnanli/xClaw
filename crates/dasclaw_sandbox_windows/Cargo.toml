[package]
name = "dasclaw_sandbox_windows"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Windows-specific sandbox runtime for x-claw, ported from openai/codex windows-sandbox-rs."
publish = false

[lib]
name = "dasclaw_sandbox_windows"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
dunce = "1.0"
portable-pty = "0.9.0"
rand = { version = "0.8", default-features = false, features = ["std", "small_rng", "std_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

# libc is unix-only; required by `pty::process` for the unix resize path.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Win32 transport (RawConPty + win::*).
# These are required only when building for Windows targets.
[target.'cfg(windows)'.dependencies]
filedescriptor = "0.8"
lazy_static = "1.4"
log = "0.4"
shared_library = "0.1"
winapi = { version = "0.3", features = [
  "handleapi",
  "minwinbase",
  "ntdef",
  "ntstatus",
  "processthreadsapi",
  "synchapi",
  "winbase",
  "wincon",
  "winerror",
  "winnt",
] }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.52"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Threading",
]

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "test-util"] }
