[package]
name = "dasclaw_sandbox_windows"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Windows-specific sandbox runtime for x-claw, ported from openai/codex windows-sandbox-rs."
publish = false

[lib]
name = "dasclaw_sandbox_windows"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
dirs = "6"
dunce = "1.0"
portable-pty = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

# libc is unix-only; required by `pty::process` for the unix resize path.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Win32 transport (RawConPty + win::*) lands in PR-1.1.3b.
# Until then, no `cfg(windows)`-only deps are required.

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "test-util"] }
