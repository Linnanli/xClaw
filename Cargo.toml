[workspace]
members = [
	"desktop-client",
	"admin-backend",
	"crates/ironclaw_auth",
	"crates/x_claw_agent",
	"desktop-client/ironclaw",
	"desktop-client/ironclaw/crates/ironclaw_common",
	"desktop-client/ironclaw/crates/ironclaw_safety",
]
exclude = ["ironclaw", "claw-code"]
resolver = "2"

[profile.dev]
opt-level = 0          # 本 crate 不优化，编译快
incremental = true     # 增量编译

[profile.dev.package."*"]
opt-level = 1          # 第三方依赖 O1，编译一次后不再重编且运行更快

[profile.release]
strip = true

[profile.dist]
inherits = "release"
lto = "thin"

[workspace.metadata.dist]
cargo-dist-version = "0.30.3"
allow-dirty = ["ci"]
ci = "github"
installers = ["shell", "powershell", "npm", "msi"]
publish-jobs = []
targets = [
	"aarch64-apple-darwin",
	"aarch64-unknown-linux-gnu",
	"aarch64-unknown-linux-musl",
	"x86_64-apple-darwin",
	"x86_64-unknown-linux-gnu",
	"x86_64-unknown-linux-musl",
	"x86_64-pc-windows-msvc",
]
windows-archive = ".tar.gz"
unix-archive = ".tar.gz"
pr-run-mode = "skip"
install-path = "CARGO_HOME"
install-updater = true
cache-builds = true

[workspace.metadata.dist.github-custom-runners]
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"
x86_64-unknown-linux-gnu = "ubuntu-22.04"
x86_64-unknown-linux-musl = "ubuntu-22.04"
x86_64-pc-windows-msvc = "windows-2022"
x86_64-apple-darwin = "macos-15-intel"
aarch64-apple-darwin = "macos-14"


