[workspace]
members = [
	"desktop-client",
	"admin-backend",
	"crates/ironclaw_auth",
	"crates/ironclaw_workspace_cap",
	"crates/x_claw_agent",
	# W1 skeletons (17 dasclaw_* crates) — see docs/plans/architecture-refactor/32-execution-plan.md §W1
	"crates/dasclaw_sandbox",
	"crates/dasclaw_pty",
	"crates/dasclaw_hooks",
	"crates/dasclaw_apply_patch",
	"crates/dasclaw_project_docs",
	"crates/dasclaw_bash_validation",
	"crates/dasclaw_governance",
	"crates/dasclaw_mcp",
	"crates/dasclaw_execpolicy",
	"crates/dasclaw_features",
	"crates/dasclaw_observability",
	"crates/dasclaw_identity",
	"crates/dasclaw_crash",
	"crates/dasclaw_net_proxy",
	# v2.4 补 3 处蓝图缺口（39 §3）
	"crates/dasclaw_lsp",
	"crates/dasclaw_git_tools",
	"crates/dasclaw_routines",
	# W2.6 接线层：组合 sandbox + pty + workspace_cap policy
	"crates/dasclaw_exec",
	# W6-C 主仓自实现 LLM provider —— 替代 claw-code-api path-dep（ADR-118 PR-A.0 骨架）
	"crates/dasclaw_llm_provider",
	# W4 ADR-121 D3-3 / Phase 1.1 — Windows sandbox port from openai/codex (commit 6e838a19fa)
	"crates/dasclaw_sandbox_windows",
	# W5 #326 Part 2 / ADR-132 — codex-execpolicy verbatim port (1,790 LOC) + codex-utils-absolute-path dep
	"crates/dasclaw_absolute_path",
	# W5 #324 sub-task 1 — codex-process-hardening verbatim port (pre-main hardening, 189 LOC)
	"crates/dasclaw_process_hardening",
	# W5 #326 Part 3a / ADR-133 — codex-shell-command verbatim port (3,348 LOC + command_safety 2,420 LOC)
	# W6 ADR-136 Step C1.1 — dasclaw_parsed_command renamed to dasclaw_protocol; will expand to file-level slice (~12,547 LOC) per ADR-136 §3 Step C1.2~C1.5
	"crates/dasclaw_protocol",
	"crates/dasclaw_shell_command",
	# W5 #324 sub-task 3 / ADR-137 — codex-network-proxy transitive deps (verbatim port)
	"crates/dasclaw_utils_home_dir",
	"crates/dasclaw_utils_rustls_provider",
	# W6 ADR-136 §3 amendment 2 PR-C1.prep-1 — codex-async-utils verbatim port (~86 LOC)
	"crates/dasclaw_async_utils",
	# W6 ADR-136 §3 amendment 2 PR-C1.prep-2 — codex-utils-string verbatim port (~436 LOC)
	"crates/dasclaw_utils_string",
	# W6 ADR-136 §3 amendment 2 PR-C1.prep-3 — codex-utils-cache verbatim port (~193 LOC)
	"crates/dasclaw_utils_cache",
	# W6 ADR-136 §3 amendment 2 PR-C1.prep-4 — codex-utils-image verbatim port (~404 LOC)
	"crates/dasclaw_utils_image",
	# W8 ADR-139 §4.5 PR1 — MITM CA trust-chain manager (dasclaw original, not verbatim)
	"crates/dasclaw_cert_trust",
	"desktop-client/ironclaw",
	"desktop-client/ironclaw/crates/ironclaw_common",
	"desktop-client/ironclaw/crates/ironclaw_safety",
]
exclude = ["ironclaw", "claw-code", "vendor"]
resolver = "2"

[profile.dev]
opt-level = 0                       # 本 crate 不优化，编译快
incremental = true                  # 增量编译
# CI OOM 防护：debug=2 时 ironclaw lib-test 链接 RAM 峰值 ~7GB，
# 在 ubuntu-latest（4 vCPU / 16GB）上必现 ld signal 7。
# line-tables-only 保留 backtrace 行号但砍 60-80% debug-info；
# split-debuginfo=unpacked 把 .dwo 文件外置，进一步降低链接器内存。
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1          # 第三方依赖 O1，编译一次后不再重编且运行更快
debug = "line-tables-only"

[profile.release]
strip = true

[profile.dist]
inherits = "release"
lto = "thin"

[workspace.metadata.dist]
cargo-dist-version = "0.30.3"
allow-dirty = ["ci"]
ci = "github"
installers = ["shell", "powershell", "npm", "msi"]
publish-jobs = []
targets = [
	"aarch64-apple-darwin",
	"aarch64-unknown-linux-gnu",
	"aarch64-unknown-linux-musl",
	"x86_64-apple-darwin",
	"x86_64-unknown-linux-gnu",
	"x86_64-unknown-linux-musl",
	"x86_64-pc-windows-msvc",
]
windows-archive = ".tar.gz"
unix-archive = ".tar.gz"
pr-run-mode = "skip"
install-path = "CARGO_HOME"
install-updater = true
cache-builds = true

[workspace.metadata.dist.github-custom-runners]
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"
x86_64-unknown-linux-gnu = "ubuntu-22.04"
x86_64-unknown-linux-musl = "ubuntu-22.04"
x86_64-pc-windows-msvc = "windows-2022"
x86_64-apple-darwin = "macos-15-intel"
aarch64-apple-darwin = "macos-14"


